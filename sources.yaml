# dealradar source registry.
# Required fields per entry: name, method (rss|api|html), url, region, allowed_html, fast_lane.
# Optional: adapter (for method=api), enabled, tz (IANA, for feeds with naive dates), notes.
#
# Policy (enforced in code, flags here are *permission to try*, never permission to bypass):
# - rss/api first. HTML article fetch only when allowed_html is true AND robots.txt allows it at runtime.
# - Slickdeals: official RSS only, never HTML (allowed_html must stay false).
# - Reddit: official OAuth API only.
# - Telegram: MTProto client API (Telethon user session); channel list lives in config.yaml.

sources:
  # ---- blogs / deal sites (RSS first, autodiscovery fallback on first-run validation) ----
  - name: hip2save
    method: rss
    url: https://hip2save.com/feed/
    region: US
    allowed_html: true
    fast_lane: false
