  # ---- Telegram public channels (MTProto client API via Telethon; NOT the Bot API) ----
  - name: telegram_channels
    method: api
    adapter: telegram
    url: mtproto://channels   # channel usernames live in config.yaml -> telegram.channels
    region: US
