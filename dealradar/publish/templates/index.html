<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wowpriced — verified deals, 50–90% off</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f5f7; --card:#ffffff; --fg:#1a1d21; --muted:#616a75; --line:#e2e6eb;
  --chip:#eef1f5; --accent:#0e7569; --accent-fg:#ffffff; --link:#0b63c4;
  --flag:#d9480f; --flag-fg:#ffffff; --cond:#b7791f; --cond-fg:#ffffff;
  --good:#107a3d; --hist:#1d5fd1; --unv:#6b7280; --dead:#b42318;
  --shadow:0 1px 2px rgba(15,23,32,.06),0 4px 14px rgba(15,23,32,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1117; --card:#161c23; --fg:#e7eaee; --muted:#9aa3ad; --line:#2a313a;
         --chip:#20262e; --accent:#2fb3a4; --accent-fg:#07211d; --link:#6cb1ff;
         --flag:#ff6b3d; --flag-fg:#2b0e02; --cond:#f2b544; --cond-fg:#3a2503;
         --good:#3fce7c; --hist:#79a8ff; --unv:#98a2b0; --dead:#ff7a6b;
         --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 48px}

/* ---- header ---- */
header{background:var(--card);border-bottom:1px solid var(--line);
       position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.hrow{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;
      gap:4px 14px;align-items:baseline}
.brand{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0}
.brand .dot{color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.meta{color:var(--muted);font-size:12.5px;margin:0;flex-basis:100%}
#cattabs{max-width:1200px;margin:0 auto;padding:4px 16px 10px;display:flex;
         flex-wrap:wrap;gap:7px}
.cattab{flex:0 0 auto;background:var(--chip);color:var(--fg);border:1px solid var(--line);
        border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;
        white-space:nowrap}
.cattab:hover{border-color:var(--accent)}
.cattab.active{background:var(--accent);border-color:var(--accent);
               color:var(--accent-fg);font-weight:700}

/* ---- controls ---- */
#controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}
#controls input,#controls select{background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
#controls input[type=search]{flex:1 1 200px;min-width:150px}
#controls input[type=number]{width:70px}
#controls label{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#controls label input[type=number]{border:none;padding:0;background:transparent}

/* ---- card grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
      gap:14px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
      transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translateY(-2px);
            box-shadow:0 2px 4px rgba(15,23,32,.08),0 10px 24px rgba(15,23,32,.12)}
.media{position:relative;height:150px;background:#fff;border-bottom:1px solid var(--line);
       display:flex;align-items:center;justify-content:center}
.media img{max-width:88%;max-height:88%;object-fit:contain}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:52px;font-weight:800;color:rgba(255,255,255,.92)}
.flag{position:absolute;top:8px;left:8px;background:var(--flag);color:var(--flag-fg);
      font-size:13px;font-weight:800;padding:3px 9px;border-radius:7px}
.condtag{position:absolute;top:8px;right:8px;background:var(--cond);color:var(--cond-fg);
         font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:7px}
.gonetag{position:absolute;inset:auto 8px 8px auto;background:var(--dead);color:#fff;
         font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:7px}
.card.gone .media img{filter:grayscale(1);opacity:.55}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.pricerow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.now{font-size:21px;font-weight:800}
.pricerow s{color:var(--muted);font-size:14px}
.save{color:var(--good);font-size:12.5px;font-weight:700}
.title{font-size:14px;line-height:1.35;margin:0;font-weight:600;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title a{color:inherit}
.headline{font-size:12.5px;color:var(--muted);line-height:1.4;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.metarow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:auto}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 7px;
      font-size:11.5px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;
       font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tier-corroborated{color:var(--good)}
.tier-history-checked{color:var(--hist)}
.tier-unverified{color:var(--unv)}
.actions{display:flex;align-items:center;gap:8px;margin-top:2px}
.getdeal{background:var(--accent);color:var(--accent-fg)!important;font-weight:700;
         font-size:13px;padding:8px 14px;border-radius:9px;flex:0 0 auto}
.getdeal:hover{text-decoration:none;filter:brightness(1.08)}
.credit{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
.credit a{color:var(--muted);text-decoration:underline}

/* ---- sections ---- */
.secth{font-size:17px;margin:28px 0 2px;padding-top:18px;border-top:1px solid var(--line)}
.secth .meta{font-weight:400;display:inline}
.empty{color:var(--muted);padding:34px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;margin-top:34px;border-top:1px solid var(--line);
       padding-top:14px}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .media{height:118px}
  .now{font-size:18px}
  .getdeal{padding:7px 11px;font-size:12.5px}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 class="brand">wowpriced<span class="dot">●</span></h1>
    <span class="tag">verified deals, 50–90% off · refreshed every 10 minutes</span>
    <p id="metaline" class="meta">Loading&hellip;</p>
  </div>
  <nav id="cattabs" aria-label="category tabs"></nav>
</header>
<div class="wrap">
<div id="controls">
  <input id="q" type="search" placeholder="search deals&hellip;" aria-label="search deals">
  <select id="storesel" aria-label="store filter"><option value="">all stores</option></select>
  <select id="sortsel" aria-label="sort order">
    <option value="pct:-1">sort: biggest % off</option>
    <option value="abs:-1">sort: most $ saved</option>
    <option value="price:1">sort: cheapest first</option>
    <option value="age:1">sort: newest first</option>
  </select>
  <label>min&nbsp;% <input id="minpct" type="number" min="0" max="100" step="1" value="0"></label>
  <label><input id="hideunv" type="checkbox"> hide unverified</label>
</div>
<div id="content"><p class="empty">Loading&hellip;</p></div>
<footer>Every deal links to the seller and credits the source that found it.
  <a href="health.html">source health</a></footer>
</div>
<script>
"use strict";
(function () {
  var state = { deals: [], meta: {}, sortKey: "pct", sortDir: -1, catTab: 0 };
  // Amazon-style department tabs over the internal category vocabulary.
  var CATGROUPS = [
    ["All", null],
    // Sentinel tab: filters on the used/open_box CONDITIONS, not category —
    // the Amazon Warehouse giveaway-priced finds get their own front door.
    ["Used & Open-Box", "USED"],
    ["Home & Kitchen", ["home", "kitchen"]],
    ["Beauty & Personal Care", ["beauty"]],
    ["Clothing, Shoes & Jewelry", ["fashion"]],
    ["Electronics", ["electronics", "computers", "gaming"]],
    ["Sports & Outdoors", ["sports", "outdoors"]],
    ["Health & Household", ["health", "grocery"]],
    ["Toys & Games", ["toys_games", "kids_baby"]],
    // Own tab by operator call: 85%-off rotors are the "WOW that's cheap"
    // screenshot material — they get buried in a grab-bag Other tab.
    ["Automotive", ["auto"]],
    ["Other", ["pets", "office", "books_media", "other"]]
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { var n = Number(v); return (v == null || isNaN(n)) ? null : n; }
  function sortVal(d, key) {
    switch (key) {
      case "pct":   return num(d.pct_at_checkout);
      case "abs":   return num(d.abs_savings);
      case "price": return num(d.final_price);
      case "age":   return num(d.age_hours);
    }
    return null;
  }

  function renderMeta() {
    // Meta line is driven entirely by deals.json: the FTC disclosure text
    // comes from meta.disclosure verbatim, never hardcoded in this template.
    var m = state.meta || {};
    var lr = m.last_run || {};
    var t = lr.finished_at || lr.started_at || m.generated_at || "";
    document.getElementById("metaline").textContent =
      "Last run: " + t + " · " + (m.count || 0) + " deals · " + (m.disclosure || "");
  }

  function populateSelect(id, values) {
    var sel = document.getElementById(id);
    var seen = {};
    values.forEach(function (s) {
      if (s && !seen[s]) {
        seen[s] = true;
        var opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s.replace(/_/g, " ");
        sel.appendChild(opt);
      }
    });
  }

  function populateStores() {
    populateSelect("storesel", state.deals.map(function (d) { return d.store || ""; }));
  }

  function renderTabs() {
    var nav = document.getElementById("cattabs");
    nav.innerHTML = CATGROUPS.map(function (g, i) {
      return '<button type="button" class="cattab' +
        (i === state.catTab ? " active" : "") + '" data-i="' + i + '">' +
        esc(g[0]) + "</button>";
    }).join("");
    nav.querySelectorAll(".cattab").forEach(function (b) {
      b.addEventListener("click", function () {
        state.catTab = Number(b.getAttribute("data-i")) || 0;
        renderTabs();
        render();
      });
    });
  }

  function filtered() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var store = document.getElementById("storesel").value;
    var group = (CATGROUPS[state.catTab] || CATGROUPS[0])[1];
    var minpct = Number(document.getElementById("minpct").value) || 0;
    var hideunv = document.getElementById("hideunv").checked;
    return state.deals.filter(function (d) {
      if (q) {
        var hay = ((d.item || "") + " " + (d.brand || "") + " " + (d.store || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (store && d.store !== store) return false;
      if (group === "USED") {
        var conds = d.conditions || [];
        if (conds.indexOf("used") === -1 && conds.indexOf("open_box") === -1) return false;
      } else if (group && group.indexOf(d.category || "other") === -1) {
        return false;
      }
      if (minpct > 0 && !(num(d.pct_at_checkout) >= minpct)) return false;
      if (hideunv && (d.badge || "unverified") === "unverified") return false;
      return true;
    });
  }

  function cmp(a, b) {
    var ka = sortVal(a, state.sortKey), kb = sortVal(b, state.sortKey);
    if (ka == null && kb == null) return 0;
    if (ka == null) return 1;           // nulls last either direction
    if (kb == null) return -1;
    if (ka < kb) return -1 * state.sortDir;
    if (ka > kb) return 1 * state.sortDir;
    return 0;
  }

  function storeHue(s) {
    var h = 0;
    for (var i = 0; i < (s || "").length; i++) { h = (h * 31 + s.charCodeAt(i)) % 360; }
    return h;
  }

  function ageText(h) {
    if (h == null) return "";
    if (h < 1) return "just in";
    if (h < 24) return Math.round(h) + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  function cardHtml(d) {
    var url = d.url || "";
    var dead = d.status === "dead";
    var conds = d.conditions || [];
    var usedTag = conds.indexOf("open_box") !== -1 ? "OPEN BOX"
      : (conds.indexOf("used") !== -1 ? "USED" : "");

    // Media: retailer's own public product image; without one (or on a
    // broken link) a store-colored tile keeps the card looking intentional.
    var phStyle = "background:hsl(" + storeHue(d.store) + ",42%,62%)" +
      (d.image_url ? ";display:none" : "");
    var media = "";
    if (d.image_url) {
      media += '<img loading="lazy" src="' + esc(d.image_url) + '" alt="' +
        esc(d.item) + '" onerror="this.style.display=\'none\';' +
        "this.nextElementSibling.style.display='flex'\">";
    }
    media += '<div class="ph" style="' + phStyle + '" aria-hidden="true">' +
      esc((d.store || "?").charAt(0).toUpperCase()) + "</div>";
    var pct = num(d.pct_at_checkout);
    if (pct != null) {
      media += '<span class="flag">-' + Math.round(pct) + "%</span>";
    }
    if (usedTag) media += '<span class="condtag">' + usedTag + "</span>";
    if (dead) media += '<span class="gonetag">GONE</span>';

    var price = d.final_price != null
      ? '<span class="now">$' + Number(d.final_price).toFixed(2) + "</span>" : "";
    if (d.regular_price != null) {
      price += " <s>$" + Number(d.regular_price).toFixed(2) + "</s>";
    }
    if (!dead && d.abs_savings != null) {
      price += ' <span class="save">save $' + Number(d.abs_savings).toFixed(2) + "</span>";
    }

    var title = url
      ? '<a href="' + esc(url) + '" rel="sponsored noopener">' + esc(d.item) + "</a>"
      : esc(d.item);

    var tier = esc(d.badge || "unverified");
    var metarow = '<span class="chip">' + esc(d.store || "") + "</span>" +
      '<span class="badge tier-' + tier + '">' + tier + "</span>";
    var extra = conds.filter(function (c) { return c !== "used" && c !== "open_box"; });
    extra.slice(0, 2).forEach(function (c) {
      metarow += '<span class="chip">' + esc(c).replace(/_/g, " ") + "</span>";
    });
    var age = ageText(num(d.age_hours));
    if (age) metarow += '<span class="chip">' + esc(age) + "</span>";

    // Source credit is required on every card.
    var credits = (d.credits || []).map(function (c) {
      return 'via <a href="' + esc(c.url) + '" rel="noopener">' + esc(c.name) + "</a>";
    }).join(", ");
    var actions = (url && !dead
      ? '<a class="getdeal" href="' + esc(url) + '" rel="sponsored noopener">Get deal</a>'
      : "") + '<span class="credit">' + credits + "</span>";

    return '<article class="card' + (dead ? " gone" : "") + '">' +
      '<div class="media">' + media + "</div>" +
      '<div class="body">' +
      '<div class="pricerow">' + (price || "&nbsp;") + "</div>" +
      '<h3 class="title">' + title + "</h3>" +
      (d.headline ? '<div class="headline">' + esc(d.headline) + "</div>" : "") +
      '<div class="metarow">' + metarow + "</div>" +
      '<div class="actions">' + actions + "</div>" +
      "</div></article>";
  }

  function gridHtml(deals) {
    return '<div class="grid">' + deals.map(cardHtml).join("") + "</div>";
  }

  function render() {
    var content = document.getElementById("content");
    if (!state.deals.length) {
      content.innerHTML = '<p class="empty">No qualifying deals this hour</p>';
      return;
    }
    var rows = filtered().sort(cmp);
    if (!rows.length) {
      content.innerHTML = '<p class="empty">No deals match the current filters</p>';
      return;
    }
    // Live deals ranked on top; dead ones collect in a "Just missed"
    // section at the very bottom (FOMO: gone before you got here),
    // newest death first. Tiers within the live set: headliners clear
    // the alert floor (meta.floors.min_pct); "strong deals" sit between
    // the site floor and the alert floor — shown, never alerted.
    var live = rows.filter(function (d) { return d.status !== "dead"; });
    var missed = rows.filter(function (d) { return d.status === "dead"; });
    missed.sort(function (a, b) {
      return String(b.died_at || "").localeCompare(String(a.died_at || ""));
    });
    var floors = (state.meta && state.meta.floors) || {};
    var alertFloor = Number(floors.min_pct);
    var headliners = live, strong = [];
    if (!isNaN(alertFloor)) {
      headliners = live.filter(function (d) { return num(d.pct_at_checkout) >= alertFloor; });
      strong = live.filter(function (d) { return num(d.pct_at_checkout) < alertFloor; });
    }
    var html = "";
    if (headliners.length) {
      html += gridHtml(headliners);
    } else {
      html += '<p class="empty">No deals above the ' +
        (isNaN(alertFloor) ? "" : Math.round(alertFloor) + "% ") +
        "alert bar right now</p>";
    }
    if (strong.length) {
      html += '<h2 class="secth">Strong deals <span class="meta">— below the ' +
        (isNaN(alertFloor) ? "" : Math.round(alertFloor) + "% ") +
        "alert bar, still big savings</span></h2>" + gridHtml(strong);
    }
    if (missed.length) {
      html += '<h2 class="secth">Just missed &#128557; <span class="meta">— ' +
        "gone before you got here. Check back more often (or get alerts)." +
        "</span></h2>" + gridHtml(missed);
    }
    content.innerHTML = html;
  }

  ["q", "storesel", "minpct", "hideunv"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  // Easy sorting: the dropdown drives the card order.
  document.getElementById("sortsel").addEventListener("change", function () {
    var parts = this.value.split(":");
    state.sortKey = parts[0];
    state.sortDir = Number(parts[1]) || -1;
    render();
  });

  function refreshStores() {
    // Rebuild the store list, keeping the user's current selection.
    var sel = document.getElementById("storesel");
    var current = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    populateStores();
    sel.value = current;
    if (sel.selectedIndex === -1) sel.selectedIndex = 0;
  }

  var loadedOnce = false;
  function loadData() {
    // cache-bust: the runner redeploys every few minutes; an open tab
    // should show new deals without anyone pressing refresh.
    fetch("deals.json?t=" + new Date().getTime(), {cache: "no-store"})
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.meta = (data && data.meta) || {};
        state.deals = (data && data.deals) || [];
        if (loadedOnce) {
          refreshStores();
        } else {
          populateStores();
          renderTabs();
          loadedOnce = true;
        }
        renderMeta();
        render();
      })
      .catch(function () {
        if (!loadedOnce) {
          document.getElementById("content").innerHTML =
            '<p class="empty">Could not load deals.json</p>';
        } // a failed background refresh keeps showing the last good data
      });
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);  // self-refresh every 5 minutes
})();
</script>
</body>
</html>
