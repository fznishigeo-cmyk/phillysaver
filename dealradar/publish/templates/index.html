<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dealradar</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff; --fg:#191c1f; --muted:#5f6670; --line:#e3e6ea; --chip:#eef1f4;
  --head:#f6f8fa; --link:#0b63c4; --good:#107a3d; --hist:#1d5fd1; --unv:#6b7280; --dead:#b42318;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101418; --fg:#e7eaee; --muted:#9aa3ad; --line:#2a313a; --chip:#1e242c;
         --head:#171d24; --link:#6cb1ff; --good:#3fce7c; --hist:#79a8ff; --unv:#98a2b0; --dead:#ff7a6b; }
}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);
     font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;}
a{color:var(--link)}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin:2px 0}
#controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
#controls input[type=search]{flex:1 1 180px;min-width:140px}
#controls input,#controls select{background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
#controls input[type=number]{width:70px}
#controls label{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center}
#cattabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.cattab{background:var(--chip);color:var(--fg);border:1px solid var(--line);
        border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.cattab.active{background:var(--link);border-color:var(--link);color:#fff;font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.headline{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:52ch;line-height:1.35}
th{background:var(--head);user-select:none;white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer}
th .arrow{color:var(--muted);font-size:11px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;
       border:1px solid currentColor;white-space:nowrap}
.tier-corroborated{color:var(--good)}
.tier-history-checked{color:var(--hist)}
.tier-unverified{color:var(--unv)}
.pct{font-weight:700}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 6px;
      font-size:12px;margin:1px 2px 1px 0;color:var(--muted)}
.dead{color:var(--dead);font-weight:600}
.alive{color:var(--good)}
s{color:var(--muted)}
.credit{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.strongh{font-size:16px;margin:22px 0 8px;border-top:1px solid var(--line);padding-top:16px}
.strongh .meta{font-weight:400}
.itemflex{display:flex;gap:10px;align-items:flex-start}
.thumb{width:56px;height:56px;object-fit:contain;border-radius:6px;background:#fff;
       border:1px solid var(--line);flex:0 0 auto}
.itemtext{min-width:0}
@media (max-width:640px){ body{padding:10px} th,td{padding:6px 5px;font-size:13px} }
</style>
</head>
<body>
<h1>dealradar</h1>
<p id="metaline" class="meta">Loading&hellip;</p>
<p class="meta"><a href="health.html">source health</a></p>
<nav id="cattabs" aria-label="category tabs"></nav>
<div id="controls">
  <input id="q" type="search" placeholder="search deals&hellip;" aria-label="search deals">
  <select id="storesel" aria-label="store filter"><option value="">all stores</option></select>
  <select id="sortsel" aria-label="sort order">
    <option value="pct:-1">sort: biggest % off</option>
    <option value="abs:-1">sort: most $ saved</option>
    <option value="price:1">sort: cheapest first</option>
    <option value="age:1">sort: newest first</option>
  </select>
  <label>min&nbsp;% <input id="minpct" type="number" min="0" max="100" step="1" value="0"></label>
  <label><input id="hideunv" type="checkbox"> hide unverified</label>
</div>
<div id="content"><p class="empty">Loading&hellip;</p></div>
<script>
"use strict";
(function () {
  var state = { deals: [], meta: {}, sortKey: "pct", sortDir: -1, catTab: 0 };
  // Amazon-style department tabs over the internal category vocabulary.
  var CATGROUPS = [
    ["All", null],
    // Sentinel tab: filters on the used/open_box CONDITIONS, not category —
    // the Amazon Warehouse giveaway-priced finds get their own front door.
    ["Used & Open-Box", "USED"],
    ["Home & Kitchen", ["home", "kitchen"]],
    ["Beauty & Personal Care", ["beauty"]],
    ["Clothing, Shoes & Jewelry", ["fashion"]],
    ["Electronics", ["electronics", "computers", "gaming"]],
    ["Sports & Outdoors", ["sports", "outdoors"]],
    ["Health & Household", ["health", "grocery"]],
    ["Toys & Games", ["toys_games", "kids_baby"]],
    ["Other", ["pets", "office", "auto", "books_media", "other"]]
  ];
  var COLS = [
    { key: "item",   label: "Item",       sortable: false },
    { key: "price",  label: "Price",      sortable: true  },
    { key: "pct",    label: "% off",      sortable: true  },
    { key: "abs",    label: "$ saved",    sortable: true  },
    { key: "tier",   label: "Verified",   sortable: false },
    { key: "cond",   label: "Conditions", sortable: false },
    { key: "store",  label: "Store",      sortable: true  },
    { key: "age",    label: "Age",        sortable: true  },
    { key: "status", label: "Status",     sortable: false },
    { key: "credit", label: "Source",     sortable: false }
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { var n = Number(v); return (v == null || isNaN(n)) ? null : n; }
  function sortVal(d, key) {
    switch (key) {
      case "pct":   return num(d.pct_at_checkout);
      case "abs":   return num(d.abs_savings);
      case "price": return num(d.final_price);
      case "store": return (d.store || "").toLowerCase();
      case "age":   return num(d.age_hours);
    }
    return null;
  }

  function renderMeta() {
    // Meta line is driven entirely by deals.json: the FTC disclosure text
    // comes from meta.disclosure verbatim, never hardcoded in this template.
    var m = state.meta || {};
    var lr = m.last_run || {};
    var t = lr.finished_at || lr.started_at || m.generated_at || "";
    document.getElementById("metaline").textContent =
      "Last run: " + t + " · " + (m.count || 0) + " deals · " + (m.disclosure || "");
  }

  function populateSelect(id, values) {
    var sel = document.getElementById(id);
    var seen = {};
    values.forEach(function (s) {
      if (s && !seen[s]) {
        seen[s] = true;
        var opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s.replace(/_/g, " ");
        sel.appendChild(opt);
      }
    });
  }

  function populateStores() {
    populateSelect("storesel", state.deals.map(function (d) { return d.store || ""; }));
  }

  function renderTabs() {
    var nav = document.getElementById("cattabs");
    nav.innerHTML = CATGROUPS.map(function (g, i) {
      return '<button type="button" class="cattab' +
        (i === state.catTab ? " active" : "") + '" data-i="' + i + '">' +
        esc(g[0]) + "</button>";
    }).join("");
    nav.querySelectorAll(".cattab").forEach(function (b) {
      b.addEventListener("click", function () {
        state.catTab = Number(b.getAttribute("data-i")) || 0;
        renderTabs();
        render();
      });
    });
  }

  function filtered() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var store = document.getElementById("storesel").value;
    var group = (CATGROUPS[state.catTab] || CATGROUPS[0])[1];
    var minpct = Number(document.getElementById("minpct").value) || 0;
    var hideunv = document.getElementById("hideunv").checked;
    return state.deals.filter(function (d) {
      if (q) {
        var hay = ((d.item || "") + " " + (d.brand || "") + " " + (d.store || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (store && d.store !== store) return false;
      if (group === "USED") {
        var conds = d.conditions || [];
        if (conds.indexOf("used") === -1 && conds.indexOf("open_box") === -1) return false;
      } else if (group && group.indexOf(d.category || "other") === -1) {
        return false;
      }
      if (minpct > 0 && !(num(d.pct_at_checkout) >= minpct)) return false;
      if (hideunv && (d.badge || "unverified") === "unverified") return false;
      return true;
    });
  }

  function cmp(a, b) {
    var ka = sortVal(a, state.sortKey), kb = sortVal(b, state.sortKey);
    if (ka == null && kb == null) return 0;
    if (ka == null) return 1;           // nulls last either direction
    if (kb == null) return -1;
    if (ka < kb) return -1 * state.sortDir;
    if (ka > kb) return 1 * state.sortDir;
    return 0;
  }

  function rowHtml(d) {
    var url = d.url || "";
    var item = url
      ? '<a href="' + esc(url) + '" rel="sponsored noopener">' + esc(d.item) + "</a>"
      : esc(d.item);
    if (d.category && d.category !== "other") {
      item += ' <span class="chip">' + esc(d.category).replace(/_/g, " ") + "</span>";
    }
    if (d.headline) {
      item += '<div class="headline">' + esc(d.headline) + "</div>";
    }
    // Thumbnail: the retailer's own public product image (broken -> hidden).
    if (d.image_url) {
      item = '<div class="itemflex"><img class="thumb" loading="lazy" src="' +
        esc(d.image_url) + '" alt="' + esc(d.item) +
        '" onerror="this.parentNode.removeChild(this)">' +
        '<div class="itemtext">' + item + "</div></div>";
    }
    var price = d.final_price != null ? "$" + Number(d.final_price).toFixed(2) : "—";
    if (d.regular_price != null) {
      price += ' <s>$' + Number(d.regular_price).toFixed(2) + "</s>";
    }
    var pct = d.pct_at_checkout != null
      ? '<span class="pct">' + Math.round(d.pct_at_checkout) + "%</span>" : "—";
    var abs = d.abs_savings != null ? "$" + Number(d.abs_savings).toFixed(2) : "—";
    var tier = esc(d.badge || "unverified");
    var tierHtml = '<span class="badge tier-' + tier + '">' + tier + "</span>";
    var conds = (d.conditions || []).map(function (c) {
      return '<span class="chip">' + esc(c) + "</span>";
    }).join("") || "—";
    var age = d.age_hours != null ? Number(d.age_hours).toFixed(1) + " h" : "—";
    var alive = d.status !== "dead";
    var statusHtml = alive
      ? '<span class="alive">&#9679; alive</span>'
      : '<span class="dead">&#10007; dead</span>';
    // Source credit is required on every row.
    var credits = (d.credits || []).map(function (c) {
      return 'via <a href="' + esc(c.url) + '" rel="noopener">' + esc(c.name) + "</a>";
    }).join(", ");
    return "<tr>" +
      "<td>" + item + "</td>" +
      "<td>" + price + "</td>" +
      "<td>" + pct + "</td>" +
      "<td>" + abs + "</td>" +
      "<td>" + tierHtml + "</td>" +
      "<td>" + conds + "</td>" +
      "<td>" + esc(d.store) + "</td>" +
      "<td>" + age + "</td>" +
      "<td>" + statusHtml + "</td>" +
      '<td class="credit">' + credits + "</td>" +
      "</tr>";
  }

  function tableHtml(rows) {
    var head = COLS.map(function (c) {
      var arrow = "";
      if (c.key === state.sortKey) {
        arrow = ' <span class="arrow">' + (state.sortDir < 0 ? "▼" : "▲") + "</span>";
      }
      return '<th data-key="' + c.key + '"' + (c.sortable ? ' class="sortable"' : "") + ">" +
        esc(c.label) + arrow + "</th>";
    }).join("");
    return '<div class="tablewrap"><table><thead><tr>' + head +
      "</tr></thead><tbody>" + rows.map(rowHtml).join("") + "</tbody></table></div>";
  }

  function render() {
    var content = document.getElementById("content");
    if (!state.deals.length) {
      content.innerHTML = '<p class="empty">No qualifying deals this hour</p>';
      return;
    }
    var rows = filtered().sort(cmp);
    if (!rows.length) {
      content.innerHTML = '<p class="empty">No deals match the current filters</p>';
      return;
    }
    // Two tiers: headliners clear the alert floor (meta.floors.min_pct);
    // "strong deals" sit between the site floor and the alert floor — shown
    // on the page, never alerted.
    var floors = (state.meta && state.meta.floors) || {};
    var alertFloor = Number(floors.min_pct);
    var headliners = rows, strong = [];
    if (!isNaN(alertFloor)) {
      headliners = rows.filter(function (d) { return num(d.pct_at_checkout) >= alertFloor; });
      strong = rows.filter(function (d) { return num(d.pct_at_checkout) < alertFloor; });
    }
    var html = "";
    if (headliners.length) {
      html += tableHtml(headliners);
    } else {
      html += '<p class="empty">No deals above the ' +
        (isNaN(alertFloor) ? "" : Math.round(alertFloor) + "% ") +
        "alert bar right now</p>";
    }
    if (strong.length) {
      html += '<h2 class="strongh">Strong deals <span class="meta">— below the ' +
        (isNaN(alertFloor) ? "" : Math.round(alertFloor) + "% ") +
        "alert bar, still big savings</span></h2>" + tableHtml(strong);
    }
    content.innerHTML = html;
    content.querySelectorAll("th.sortable").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-key");
        if (state.sortKey === key) {
          state.sortDir = -state.sortDir;
        } else {
          state.sortKey = key;
          state.sortDir = key === "store" ? 1 : -1;
        }
        render();
      });
    });
  }

  ["q", "storesel", "minpct", "hideunv"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  // Easy sorting: the dropdown drives the same state the column headers do.
  document.getElementById("sortsel").addEventListener("change", function () {
    var parts = this.value.split(":");
    state.sortKey = parts[0];
    state.sortDir = Number(parts[1]) || -1;
    render();
  });

  function refreshStores() {
    // Rebuild the store list, keeping the user's current selection.
    var sel = document.getElementById("storesel");
    var current = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    populateStores();
    sel.value = current;
    if (sel.selectedIndex === -1) sel.selectedIndex = 0;
  }

  var loadedOnce = false;
  function loadData() {
    // cache-bust: the runner redeploys every few minutes; an open tab
    // should show new deals without anyone pressing refresh.
    fetch("deals.json?t=" + new Date().getTime(), {cache: "no-store"})
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.meta = (data && data.meta) || {};
        state.deals = (data && data.deals) || [];
        if (loadedOnce) {
          refreshStores();
        } else {
          populateStores();
          renderTabs();
          loadedOnce = true;
        }
        renderMeta();
        render();
      })
      .catch(function () {
        if (!loadedOnce) {
          document.getElementById("content").innerHTML =
            '<p class="empty">Could not load deals.json</p>';
        } // a failed background refresh keeps showing the last good data
      });
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);  // self-refresh every 5 minutes
})();
</script>
</body>
</html>
