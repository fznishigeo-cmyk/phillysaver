# Category page copy. Discount floors come from config.yaml.

used-open-box:
  title: "Used & Open-Box Deals (incl. Amazon Resale)"
  description: "Used and open-box deals at {used_floor}% off or more, including Amazon Resale offers. Check the condition and return policy before buying."
  intro: >-
    Used, refurbished and open-box offers at least {used_floor}% off. Amazon
    Resale listings show a condition grade. Review the included accessories,
    warranty and return policy on the offer page.
home-kitchen:
  title: "Home & Kitchen Deals"
  description: "Home and kitchen deals at {site_floor}% off or more: cookware, small appliances, bedding and storage."
  intro: >-
    Cookware, small appliances, bedding, storage and other home goods at least
    {site_floor}% off. We check prices before we show them. Review sizes and
    delivery costs before buying.
beauty-personal-care:
  title: "Beauty & Personal Care Deals"
  description: "Beauty and personal care deals at {site_floor}% off or more: skincare, makeup, hair tools and grooming."
  intro: >-
    Skincare, makeup, hair tools, fragrance and grooming deals at least
    {site_floor}% off. Check the size, shade and offer conditions on the
    retailer's page.
clothing-shoes-jewelry:
  title: "Clothing, Shoes & Jewelry Deals"
  description: "Clothing, shoe and jewelry deals at {site_floor}% off or more. Compare sizes, colors and offer conditions."
  intro: >-
    Clothing, shoes, bags, watches and jewelry at least {site_floor}% off.
    Prices can vary by size or color; when the card shows a range, the
    discount uses the highest price.
electronics:
  title: "Electronics, Computer & Gaming Deals"
  description: "Electronics, computer and gaming deals at {site_floor}% off or more. Check model details, condition and warranty."
  intro: >-
    Headphones, chargers, laptops, monitors, games and other electronics at
    least {site_floor}% off. Compare the exact model, included accessories and
    warranty before buying.
sports-outdoors:
  title: "Sports & Outdoors Deals"
  description: "Sports, fitness, camping and outdoor deals at {site_floor}% off or more."
  intro: >-
    Fitness gear, camping, cycling, fishing and other outdoor deals at least
    {site_floor}% off. Check sizing, specifications and shipping costs on the
    retailer's page.
health-household:
  title: "Health & Household Deals"
  description: "Health, household and grocery deals at {site_floor}% off or more: vitamins, cleaning supplies, paper goods and pantry staples."
  intro: >-
    Vitamins, first aid, cleaning supplies, paper goods and pantry staples at
    least {site_floor}% off. Review pack sizes and any coupon or subscription
    requirements shown on the card.
toys-games:
  title: "Toys, Games & Baby Deals"
  description: "Toy, game, kids and baby deals at {site_floor}% off or more."
  intro: >-
    Toys, board games, puzzles, kids' gear and baby essentials at least
    {site_floor}% off. Check age guidance, contents and offer conditions
    before buying.
automotive:
  title: "Automotive Deals"
  description: "Car parts, tools and accessories at {site_floor}% off or more."
  intro: >-
    Brake parts, tools, car care and accessories at least {site_floor}% off.
    Confirm compatibility with your vehicle on the seller's page.
pets:
  title: "Pet Supply Deals"
  description: "Pet food, toys, beds and supplies at {site_floor}% off or more."
  intro: >-
    Food, treats, toys, beds and supplies for dogs, cats and other pets at
    least {site_floor}% off. Compare sizes, quantities and any subscription
    requirements.
other:
  title: "Office, Books, Media & More Deals"
  description: "Office supplies, books, media and other deals at {site_floor}% off or more."
  intro: >-
    Office supplies, books, movies, music and more at least {site_floor}% off.
    We check prices before we show them; review the offer details before
    buying.
