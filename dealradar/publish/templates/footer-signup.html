<section id="footer-signup" class="footersignup" aria-labelledby="footer-signup-title" hidden>
  <h2 id="footer-signup-title">Sign up for the latest deals</h2>
  <form class="joinform" data-join-footer>
    <div class="footeremail">
      <label for="footer-email" class="sr-only">Email address</label>
      <input id="footer-email" name="email" type="email" placeholder="Email address" autocomplete="email" required>
      <button type="submit" aria-label="Sign up"><span aria-hidden="true">→</span></button>
    </div>
    <p data-join-message role="status" hidden></p>
    <p class="footerlegal">By subscribing you agree to our <a href="/privacy.html">privacy policy</a>.</p>
  </form>
  <p id="footer-signup-success" role="status" hidden>Thank you for signing up!</p>
</section>
