@media (prefers-color-scheme: dark){

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);

.hrow{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;

.brand a{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none}
.mark{width:32px;height:32px;flex:none;transform:rotate(-8deg)}
.word{font-weight:900;letter-spacing:-.8px}
.word em{font-style:normal;font-weight:650;letter-spacing:-.4px;color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
h1{font-size:30px;line-height:1.2;margin:32px 0 6px}
.lede{color:var(--muted);font-size:17px;margin:0 0 24px}
h2{font-size:20px;margin:30px 0 8px}
p{margin:0 0 14px}
.hubs{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 14px}
.hubs a{display:inline-block;background:var(--chip);color:var(--fg);border:1px solid var(--line);
        border-radius:999px;padding:5px 13px;font-size:14px}
.hubs a:hover{border-color:var(--accent);text-decoration:none}
footer{color:var(--muted);font-size:12.5px;margin-top:34px;border-top:1px solid var(--line);
       padding-top:14px}
.fnav{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:13.5px}
@media (max-width:640px){ h1{font-size:26px} }
