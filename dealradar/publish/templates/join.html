<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%271%27 y=%271%27 width=%2730%27 height=%2730%27 rx=%278%27 fill=%27%23129486%27/%3E%3Cpolyline points=%276.5,11 11,22.5 16,14 21,22.5 25.5,12.5%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2725.5%27 cy=%276.3%27 r=%272.4%27 fill=%27%23ffc94d%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#0e7569">
<title>Join wowpriced</title>
<meta name="description" content="Join wowpriced free for one email with the best deals. Unsubscribe anytime.">
<link rel="canonical" href="{{SITE_URL}}/join.html">
<style>
:root{color-scheme:light dark;--bg:#f3f5f7;--card:#fff;--fg:#1a1d21;--muted:#5c6570;
  --line:#e2e6eb;--accent:#0e7569;--accent-fg:#fff;--accent-hover:#0f7b6e;
  --shadow:0 8px 32px rgba(15,23,32,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161c23;--fg:#e7eaee;
  --muted:#a4adb7;--line:#2a313a;--accent:#2fb3a4;--accent-fg:#07211d;
  --accent-hover:#42c2b2;--shadow:0 8px 32px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
input::placeholder{color:var(--muted);opacity:1}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{background:#0f1b22;color:#f3f7f8;border-bottom:1px solid rgba(255,255,255,.13)}
.hrow{max-width:1200px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
header a{color:#9fe6da}
.brand{margin:0;font-size:24px;line-height:1}
.brand a{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.mark{width:36px;height:36px;flex:none;transform:rotate(-8deg)}
.word{font-weight:900;letter-spacing:-.9px}
.word em{font-style:normal;font-weight:650;letter-spacing:-.5px;color:#cfe9e5}
.back{font-size:14px;text-decoration:none}
.back:hover{text-decoration:underline}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:80px 24px;isolation:isolate;overflow:hidden}
{{JOIN_STYLE}}
@media (max-width:640px){.wrap{padding:40px 16px}
  .joincard{padding:28px 24px}.hrow{padding:16px;gap:12px}.back{font-size:13px}h1{font-size:27px}}
.wrap.footerwrap{padding-top:0}
p:not(.brand) a:not(.getdeal):not(.btn):not(.pwbtn),.credit a,.how a,footer a:not(.getdeal):not(.btn):not(.pwbtn){
  text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
</style>
</head>
<body>
<header><div class="hrow">
<p class="brand"><a href="/" aria-label="wowpriced"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="markg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd8c6"/><stop offset="1" stop-color="#0e7569"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#markg)"/><polyline points="6.5,11 11,22.5 16,14 21,22.5 25.5,12.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.5" cy="6.3" r="2.4" fill="#ffc94d"/></svg><span class="word">wow<em>priced</em></span></a></p>
<a class="back" href="/">Back to deals</a>
</div></header>
<main class="wrap">
  {{JOIN_CARD}}
</main>
<div class="wrap footerwrap">{{SITE_FOOTER}}</div>
<script>{{SUPPORT_SCRIPT}}</script>
</body>
</html>
