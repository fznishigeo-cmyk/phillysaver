<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%271%27 y=%271%27 width=%2730%27 height=%2730%27 rx=%278%27 fill=%27%23129486%27/%3E%3Cpolyline points=%276.5,11 11,22.5 16,14 21,22.5 25.5,12.5%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2725.5%27 cy=%276.3%27 r=%272.4%27 fill=%27%23ffc94d%27/%3E%3C/svg%3E">
<title>wowpriced — you're in</title>
<meta name="robots" content="noindex">
<script>
// The Checkout Session id Stripe adds (?session_id=) is the payer's receipt:
// it leaves the address bar before anything later on the page (the
// analytics and ad tags in the head, when on) can read or send the URL.
// The page script below takes it from window.wpCheckoutId.
(function () {
  var id = new URLSearchParams(location.search).get("session_id") || "";
  window.wpCheckoutId = id;
  if (id) { try { history.replaceState(null, "", location.pathname); } catch (e) { /* fine */ } }
})();
</script>
<style>
:root{ color-scheme: light dark;
  --bg:#f3f5f7; --card:#ffffff; --fg:#1a1d21; --muted:#616a75; --line:#e2e6eb;
  --accent:#0e7569; --accent-fg:#ffffff; --link:#0b63c4; --warn:#b45309; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1117; --card:#161c23; --fg:#e7eaee; --muted:#9aa3ad; --line:#2a313a;
         --accent:#2fb3a4; --accent-fg:#07211d; --link:#6cb1ff; --warn:#fbbf24; } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;padding:48px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{font-size:22px;font-weight:800;margin:0 0 18px}
.brand a{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none}
.mark{width:32px;height:32px;flex:none;transform:rotate(-8deg)}
.word{font-weight:900;letter-spacing:-.8px}
.word em{font-style:normal;font-weight:650;letter-spacing:-.4px;color:var(--accent)}
h1{font-size:28px;margin:0 0 10px}
p{margin:0 0 14px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);font-weight:700;
     padding:10px 16px;border-radius:10px;text-decoration:none;margin-top:6px}
.muted{color:var(--muted);font-size:14px}
.claim{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;
       padding:12px 14px;margin:0 0 16px}
.claim.err{border-left-color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;margin:0;color:var(--link);font:inherit;
         font-weight:700;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <p class="brand"><a href="./" aria-label="wowpriced"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="markg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd8c6"/><stop offset="1" stop-color="#0e7569"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#markg)"/><polyline points="6.5,11 11,22.5 16,14 21,22.5 25.5,12.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.5" cy="6.3" r="2.4" fill="#ffc94d"/></svg><span class="word">wow<em>priced</em></span></a></p>
  <h1>You're in 🎉</h1>
  <div class="claim" id="claim" hidden></div>
  <p>Every deal on the wall is yours now — up to 90% off, fake "list prices" removed, Amazon prices
     re-checked live — with new deals every 10 minutes. Bookmark the live wall:</p>
  <p><a class="btn" href="./">Open the deal wall</a></p>
  <p class="muted" id="portal" style="display:none">Manage your
     membership any time: <a id="portallink" rel="noopener">billing portal</a>.</p>
  <p class="muted">Questions? Use the <a href="contact.html">contact page</a>.</p>
</div></div>
<script>
"use strict";
// Stripe Checkout (the Worker's free-trial checkout and the Payment Link)
// sends the payer here with ?session_id={CHECKOUT_SESSION_ID}
// (docs/paywall.md). Signed in: POST /api/claim binds that payment to the
// account. Signed out: the id waits in sessionStorage until they sign in on
// the home page and come back, so the receipt is never lost.
(function () {
  var box = document.getElementById("claim");
  var CLAIM_KEY = "wp.claim", SESSION_KEY = "wp.session";
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* blocked */ } }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) { /* blocked */ } }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function show(html, isErr) { box.innerHTML = html; box.className = "claim" + (isErr ? " err" : ""); box.hidden = false; }
  function text(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // The operator's contact email (config contact_email, filled in by the
  // publisher; "" when unset): the other way to cancel.
  var CONTACT_EMAIL = "{{CONTACT_EMAIL}}";
  var EMAIL = /^[^\s@"<>]+@[^\s@"<>]+$/.test(CONTACT_EMAIL) ? CONTACT_EMAIL : "";
  var MAILTO = EMAIL ? "<a href=\"mailto:" + EMAIL + "\">" + EMAIL + "</a>" : "";
  var CANCEL = "Cancel anytime online" + (EMAIL ? " or email " + MAILTO : "") + ".";
  var NO_PORTAL = "Online billing is unavailable right now. " + (EMAIL
    ? "Email " + MAILTO + " and we'll cancel or change your membership."
    : "Use the <a href=\"contact.html\">contact page</a> and we'll cancel or change your membership.");

  var fromUrl = window.wpCheckoutId || "";  // taken off the URL in the head
  if (fromUrl) ssSet(CLAIM_KEY, fromUrl);
  var sid = fromUrl || ssGet(CLAIM_KEY) || "";
  var token = lsGet(SESSION_KEY) || "";

  // start_trial for the operator's analytics and ad tags (window.wpTrack,
  // only when the publisher put them in the head): Stripe sends only a
  // completed checkout here, and each checkout session counts once. The
  // marker is written before the event goes out: a browser that blocks
  // storage is not counted, rather than counted on every reload.
  if (/^cs_[A-Za-z0-9_]{8,200}$/.test(fromUrl) && typeof window.wpTrack === "function") {
    var TRIAL_KEY = "wp.trial." + fromUrl;
    if (!lsGet(TRIAL_KEY)) {
      try { localStorage.setItem(TRIAL_KEY, "1"); } catch (e) { /* blocked */ }
      if (lsGet(TRIAL_KEY)) { try { window.wpTrack("start_trial"); } catch (e) { /* never in the way */ } }
    }
  }

  var ERRORS = {
    bad_session: "That payment isn't a completed membership checkout, so there is nothing to attach.",
    unknown_session: "Stripe doesn't recognise that payment. Open this page from the link Stripe sent you after paying.",
    stripe_unavailable: "Stripe could not be reached just now. Reload this page in a minute to try again.",
    signin_unavailable: "Sign-in is being set up on our side. Reload this page in a few minutes.",
    rate_limited: "Too many attempts from your network. Try again in an hour.",
    unauthorized: "Your sign-in expired. Log in again on the home page, then come back here.",
    wrong_account: "This payment belongs to a different wowpriced account. Log in with the email you used at checkout, " +
      "then come back to this page: your payment is remembered on this device. <a href=\"./#login\">Log in</a>",
    already_claimed: "This payment is already attached to another wowpriced account. " +
      "<a href=\"./#login\">Log in</a> with that account, or " +
      (EMAIL ? "email " + MAILTO + "." : "use the <a href=\"contact.html\">contact page</a>.")
  };
  var portalLink = "";
  function fmtDay(s) {
    var t = Date.parse(s || "");
    return isNaN(t) ? "" : new Date(t).toLocaleDateString(undefined, { month: "long", day: "numeric" });
  }
  // "Manage membership": POST /api/portal opens Stripe's billing portal for
  // this account; without one (404/503, or no such route yet) the portal
  // link from me or deals.json meta, else the email route beside it.
  function manage(apiUrl, me) {
    var btn = document.getElementById("manage");
    if (!btn) return;
    var fallback = /^https:\/\//.test(me.portal_url || portalLink) ? (me.portal_url || portalLink) : "";
    btn.addEventListener("click", function () {
      btn.disabled = true;
      fetch(apiUrl + "/api/portal", {
        method: "POST", cache: "no-store",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: "{}"
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, json: j || {} }; }); })
        .then(function (res) {
          var url = res.ok && /^https:\/\//.test(res.json.url || "") ? res.json.url
            : (/^https:\/\//.test(res.json.fallback_url || "") ? res.json.fallback_url : fallback);
          if (url) { location.assign(url); return; }
          btn.disabled = false;
          document.getElementById("managenote").innerHTML = " " + NO_PORTAL;
        })
        .catch(function () { btn.disabled = false; });
    });
  }
  // Back from Stripe's portal restores this page from the back/forward
  // cache with the button still disabled.
  window.addEventListener("pageshow", function (e) {
    var btn = document.getElementById("manage");
    if (e.persisted && btn) btn.disabled = false;
  });

  function claim(apiUrl) {
    show("Attaching your membership to <b>this account</b>…");
    fetch(apiUrl + "/api/claim", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ session_id: sid })
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j || {} }; }); })
      .then(function (res) {
        if (res.status === 200 && res.json.me) {
          ssDel(CLAIM_KEY);
          var me = res.json.me, day = fmtDay(me.trial_ends_at);
          var manageBtn = " " + CANCEL + " <button type=\"button\" id=\"manage\" class=\"linkbtn\">" +
            "Manage membership</button><span id=\"managenote\"></span>";
          // A me without trial_available comes from a Worker that predates
          // the card-up-front trial (a card-less trial charges nothing), so
          // the trial's billing terms are shown only with the new shape.
          if (me.reason === "trial" && "trial_available" in me) {
            show("<b>Your free trial has started.</b> You won't be charged until " +
                 (day ? text(day) : "the trial ends") + ". Then $9.99/month, renews monthly " +
                 "until you cancel." + manageBtn);
          } else if (me.member) {
            show("<b>Membership activated</b> for " + text(me.email) +
                 ". Every deal on the wall is yours now. <a href=\"./\">Open the deal wall</a>." + manageBtn);
          } else {
            show("<b>Payment attached</b> to " + text(me.email) + ". Stripe hasn't confirmed " +
                 "the subscription yet: reload this page in a minute.");
          }
          manage(apiUrl, me);
          return;
        }
        if (res.status === 401) { try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* blocked */ } }
        var code = res.json.error || ("http_" + res.status);
        // A payment already attached to another account is done with on
        // this device (that account has it); wrong_account keeps it for
        // the right account to claim.
        if (code === "bad_session" || code === "unknown_session" || code === "already_claimed") ssDel(CLAIM_KEY);
        show("<b>Couldn't attach this membership.</b> " + (ERRORS[code] || ("Error: " + text(code) + ".")), true);
      })
      .catch(function () { show("<b>Couldn't attach this membership.</b> " + ERRORS.stripe_unavailable, true); });
  }

  fetch("deals.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var meta = (d && d.meta) || {};
      if (meta.portal_url) {
        portalLink = meta.portal_url;
        document.getElementById("portallink").href = meta.portal_url;
        document.getElementById("portal").style.display = "";
      }
      if (!sid || !meta.api_url) return;
      var apiUrl = String(meta.api_url).replace(/\/+$/, "");
      if (token) claim(apiUrl);
      else show("<b>Create your account (or log in) to attach this membership.</b> " +
                "Use <a href=\"./#login\">Log in</a> at the top of the home page (sign up free if you don't have an account yet), " +
                "then come back to this page: your payment is remembered on this device until then.");
    }).catch(function () {});
})();
</script>
</body>
</html>
