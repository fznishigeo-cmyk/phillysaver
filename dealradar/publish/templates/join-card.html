<section class="joincard" aria-labelledby="join-title">
  {{JOIN_CLOSE}}
  <{{JOIN_HEADING}} id="join-title">Join wowpriced</{{JOIN_HEADING}}>
  <p id="join-description">The day's best deals in one email. Free. Unsubscribe anytime.</p>
  <div id="join-google" class="joingoogle" hidden></div>
  <p id="join-google-message" role="status" hidden></p>
  <button id="join-email-choice" class="joinchoice" type="button" aria-expanded="false" aria-controls="join-email-fields">Continue with email</button>
  <div id="join-email-fields" hidden>{{JOIN_FORM}}</div>
  <p class="joinlegal">By joining you agree to our <a href="/privacy.html">privacy policy</a></p>
</section>
