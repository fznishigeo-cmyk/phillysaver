<section class="joincard" aria-labelledby="join-title">
  {{JOIN_CLOSE}}
  <{{JOIN_HEADING}} id="join-title">Join wowpriced</{{JOIN_HEADING}}>
  <p id="join-description">The day's best deals in one email. Free.</p>
  <div id="join-email-fields" hidden>
    {{JOIN_FORM}}
    <button id="join-back" class="joinback" type="button">Back</button>
  </div>
  <div id="join-step-one">
    <p id="join-google-or" class="joinor" hidden>or</p>
    <div id="join-google" class="joingoogle" hidden></div>
    <p id="join-google-message" role="status" hidden></p>
    <button id="join-email-choice" class="joinchoice" type="button" aria-expanded="false" aria-controls="join-email-fields"><span aria-hidden="true">@</span> Continue with email</button>
  </div>
  <div id="join-success" hidden>
    <p>When our deals email starts, we'll send you one email to confirm first.</p>
    <a id="join-deals" href="/" hidden>Back to deals</a>
  </div>
  <p id="join-legal" class="joinlegal">By continuing, you agree to wowpriced's <a href="/privacy.html">privacy policy</a>.</p>
</section>
