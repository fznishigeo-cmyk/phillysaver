<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dealradar — source health</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff; --fg:#191c1f; --muted:#5f6670; --line:#e3e6ea;
  --head:#f6f8fa; --link:#0b63c4; --good:#107a3d; --bad:#b42318;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101418; --fg:#e7eaee; --muted:#9aa3ad; --line:#2a313a;
         --head:#171d24; --link:#6cb1ff; --good:#3fce7c; --bad:#ff7a6b; }
}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);
     font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;}
a{color:var(--link)}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin:2px 0}
.summary{font-size:14px;margin:10px 0;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--head);white-space:nowrap}
.ok{color:var(--good);font-weight:600}
.tripped{color:var(--bad);font-weight:600}
.err{color:var(--muted);font-size:12px;max-width:340px;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:24px 0;text-align:center}
@media (max-width:640px){ body{padding:10px} th,td{padding:6px 5px;font-size:13px} }
</style>
</head>
<body>
<h1>source health</h1>
<p class="meta"><a href="index.html">&larr; back to deals</a></p>
<p id="summary" class="summary">Loading&hellip;</p>
<div id="content"><p class="empty">Loading&hellip;</p></div>
<script>
"use strict";
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(data) {
    var sources = (data && data.sources) || [];
    var lr = (data && data.last_run) || {};
    var lastRun = lr.finished_at || lr.started_at || (data && data.generated_at) || "";
    var trippedCount = sources.filter(function (s) { return s.tripped; }).length;
    document.getElementById("summary").textContent =
      sources.length + " sources · " + trippedCount + " tripped · last run " + lastRun;

    var content = document.getElementById("content");
    if (!sources.length) {
      content.innerHTML = '<p class="empty">No source health recorded yet</p>';
      return;
    }
    var rows = sources.map(function (s) {
      var state = s.tripped
        ? '<span class="tripped">tripped</span>'
        : '<span class="ok">ok</span>';
      return "<tr>" +
        "<td>" + esc(s.source_name) + "</td>" +
        "<td>" + state + "</td>" +
        "<td>" + esc(s.last_success_at || "—") + "</td>" +
        "<td>" + esc(s.items_last_run != null ? s.items_last_run : 0) + "</td>" +
        "<td>" + esc(s.consecutive_failures != null ? s.consecutive_failures : 0) + "</td>" +
        "<td>" + esc(s.tripped_until || "—") + "</td>" +
        '<td class="err">' + esc(s.last_error || "") + "</td>" +
        "</tr>";
    }).join("");
    content.innerHTML = '<div class="tablewrap"><table><thead><tr>' +
      "<th>Source</th><th>State</th><th>Last success</th><th>Items/hr</th>" +
      "<th>Consecutive failures</th><th>Tripped until</th><th>Last error</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  fetch("health.json")
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById("content").innerHTML =
        '<p class="empty">Could not load health.json</p>';
    });
})();
</script>
</body>
</html>
