  enabled: true
  exclude_words: [sex, sexual, sex toy, sex toys, adult toy, adult toys, erotic, fetish, bondage, bdsm,
                  dildo, dildos, vibrator, vibrators, vibrating egg, wand massager, personal massager,
                  clitoral, clit, g spot, anal, butt plug, butt plugs, prostate massager, cock ring,
