        electronics:
          share: 3
          groups: [gadgets]
          categories: [electronics, computers, gaming]
        rest:                  # "the rest what you think": the best of everything else
          share: 5
    popular_affordable:        # task 255: private Amazon popularity + low checkout price
      enabled: true            # operator 2026-10-17: "gadgets that people will actually buy" (bestsellers ≥1000/month); shadow ran since Oct 16
      shadow: true             # encrypted-state comparison; private growth report only
      min_monthly_sold: 1000
      max_price: 50
      pct_over_floor: 10        # derives the threshold from publish.min_pct
      max_age_h: 72
      weight: 1.25
      max_share: 0.25           # at most 6 boosted picks per 24-card window
    everyday_price:          # operator 2026-10-17: lean toward everyday prices, softly
      enabled: true          # operator 2026-10-17 ~02:00Z: "$200 items at the top, nobody will buy that"
      full_until: 30         # final_price <= this: factor 1.0 (operator 2026-10-23 ~00:05Z: "not very pricey stuff"; was 40)
      floor_from: 75         # final_price >= this: floor_factor (was 100)
      floor_factor: 0.45     # linear between full_until and floor_from (was 0.55)
    top_picks:                # the All tab's first cards (operator, 2026-10-12)
