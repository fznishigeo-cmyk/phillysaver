  drop_fresh: true  # task 303c: balanced ninety-card drops; missing/false preserves previous bytes
  drop_shuffle: true  # task 300: change Trending at every clock mark, even without a new publish; missing/false restores legacy drops
  dark_polish: true   # task 254: dark-mode-only CSS + color-scheme meta; light bytes unchanged
