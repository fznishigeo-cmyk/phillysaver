state:
  warn_enc_mb: 70            # Decimal MB (1,000,000 bytes); warning above this size.
  # Fail before any push at or above this size. GitHub blocks files over 100 MiB
  # (104.9 MB); 95 since 2026-10-22 (was 90) while shorter retention catches up.
  max_enc_mb: 95
  # Copy mode (operator 2026-10-21/22): after each push to the data branch the same
  # encrypted file also goes to the R2 bucket (secrets R2_*); git stays the source
  # of truth. false = no copies. r2_keep = timestamped copies kept (+ latest.enc).
  r2_copy: true
  r2_keep: 24
  # R2 primary (phase 2; on only after the r2-drill passes): every save uploads to R2
  # FIRST and refuses without it; at/above max_enc_mb the data branch gets only the
  # pointer state.r2.json and restore_state.sh downloads exactly that object (bytes +
  # sha256 checked) or refuses to start. Strict boolean.
  r2_primary: false

retention:
  state_retention_337: true  # OFF preserves previous maintenance/writer bytes.
  api_cache_days: 1         # Opaque api: validators only; response bodies are never persisted.
  post_receipt_details_days: 7  # Compact older receipts without live sightings; fresh reads stay in posts_seen.
  audit_detail_days: 9       # Older details become counted history; run/send guards survive. Reader floor 9; was 14 until 2026-10-22.
  audit_hot_days: 1          # Older completed source audits use lossless packed hashes until day 14.
  click_raw_days: 30         # Older click buckets become daily counts per public deal key.
  accuracy_detail_days: 14   # Also retain only the latest observations per deal/source below.
  accuracy_last_per_deal: 24 # Exact timestamp/bucket/outcome counts preserve the accuracy report.
  terminal_indexnow_versions_days: 1  # Clear completed payloads; keep endpoint/run/status anchors forever.
  posts_seen_days: 30
  # Cross-source parse reuse (task 059): the same post text shows up in
  # several feeds within hours. Short on purpose: every row rides the
  # encrypted state.db that is pushed to the data branch every run.
  post_parses_days: 2
  deals_days: 14             # DEAD deals are deleted this long after they died; a live deal is never removed for its age
  # Expire non-dead rows that no source posted for this many days, only after a full render
  # proves them off every public surface; deals on the site are never touched (2026-10-11 rule).
  # Operator 2026-10-21: "CONFIRMED YES GO AHEAD" (7 days). null = OFF.
  offsite_unseen_days: 7
  accuracy_samples_days: 9  # Legacy/OFF window; ON uses accuracy_detail_days and accuracy_last_per_deal.
  deal_click_shown_days: 8   # Seven-day learner + margin; a longer configured lookback always wins.
  source_audit_posts_days: 9  # Legacy/OFF window; ON uses audit_detail_days (reader minimum 9).
  keepa_recheck_history_samples: 12  # Per deal; never below recheck_adaptive.history_samples.
  compact_deal_payloads: true  # Rehydrate duplicate SQL fields/sightings; preserve every fact.
  compact_accuracy_samples: true  # Intern replay keys, store UTC seconds; identical private reports.
  compact_click_exposure: true  # One daily row with exact hourly seconds; identical learner features.
  state_maintenance_max_rows: 4096  # Per table/run, including fresh rows; transactional chunks of 64.
  state_maintenance_budget_s: 1.0  # Shared cooperative allowance, within the existing tail deadline.
  state_maintenance_after_deadline: true  # Hourly runs reach the tail with no time left (maintenance deferred every run); the state trim (not the HTTP cache prune) still spends at most the budget above.
  # Settled/released/uncertain calls and their per-day reservations: enough
  # for 7-day reports and an audit margin; caps need today and tomorrow only.
  # Pending calls and today's/tomorrow's ledger rows always survive.
  # 10 since 2026-10-22 (was 35): the longest reader, the hands-off scorecard,
  # looks back 9 UTC days; state.db.enc had reached 78.5 MB.
  llm_calls_days: 10
  run_stats_days: 10         # AI-yield/recheck-yield tables (readers use 7 complete UTC days); run_stats rows stay under 337. Was 60 until 2026-10-22.
  http_cache_days: 30        # keep recent conditional-GET validators; idle URLs can fetch anew
  # Compact (VACUUM, hourly only) once free pages pass this % of state.db. Freed pages keep
  # their old bytes in the encrypted copy; at 10 a ~6% free file (~17 MB, 2026-10-22) never compacted.
  vacuum_free_pct: 3
  # Offline bounds/limits: docs/incremental-cache-maintenance.md. Ship OFF.
  incremental_cache:
    enabled: false
    max_examined_per_run: 256  # includes fresh rows; chunks of at most 64
    budget_s: 0.25            # cooperative SQL slices, before the existing tail reserve
  outgoing_days: 60          # failed (rejected) attempts only; sent records and pending guards never expire
  # Only terminal batch payloads expire; run/status receipts never expire.
  # Missing/null keeps the previous unlimited payload retention.
  indexnow_batch_versions_days: 7
  appeal_scores_days: 7      # Never shorter than appeal_score.ttl_h; run claims stay.

non_amazon_freshness:
  enabled: true
  source_recheck_h: 12
  source_rechecks_per_run: 20
  source_recheck_budget_s: 60  # preserve time for evidence parsing and publication
  stale_label_h: 24
  stale_hide_h: 48
  stores: {Woot: {stale_hide_h: 12}, woot.com: {stale_hide_h: 12}}  # Woot offers end/sell out fast (operator 2026-10-17)

# Official quotas and activation: docs/non-amazon-freshness.md
bestbuy:
  tolerance_pct: 5
  recheck_h: 0                 # due each run; same-run retries do not buy checks again
  requests_per_second: 5       # upper bound; the repo's 1 request/s/host still applies
  max_requests_per_run: 20     # up to 100 SKUs/request; retries also consume this cap
  max_requests_per_day: 45000  # below the official 50,000/day limit

ebay:
  tolerance_pct: 5
  recheck_h: 0
  requests_per_second: 1
  max_requests_per_run: 30     # includes OAuth and retries; ~30 s at 1/s before intake
  max_requests_per_day: 4500   # below Browse's 5,000/day limit; shared across runs

