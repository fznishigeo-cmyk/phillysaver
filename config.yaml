      # buyer and the rest think the site is fake (operator, 2026-10-13): they
      # stay on the wall (Used tab) but are never top picks.
      exclude_conditions: [used, open_box, refurbished]
      max_same_store: 40
      max_same_brand: 2         # operator 2026-10-17: one brand's 80%-off sweatshirts filled the first screen; was 3
      brand_from_title: true    # missing brand = the title's first two words (Amazon often leaves it blank)
      max_same_category: 24
      max_title_twins: 2
      # Operator 2026-10-17 ("is all clothes where are the tech gadgets"): at most 2
      # clothing cards in every 6 of the first 24 picks; the rest keep their order after.
      max_clothing_per_window: 2
      mix_window: 6
      mix_slots: 24
      clothing_categories: [fashion]
      clothing_words: [sweatshirt, hoodie, crewneck, pullover, t-shirt, tee, shirt, jacket, coat, vest,
                       sweater, cardigan, dress, skirt, jeans, pants, joggers, leggings, shorts, bra,
                       sports bra, underwear, socks, pajamas, sneakers, shoes, boots, sandals, slippers,
                       # operator 2026-10-17 (live first 24): blouses and quarter zips read as clothing too
                       blouse, quarter zip, polo, flannel, fleece, romper, jumpsuit, tank top, crop top,
                       camisole, bodysuit, tunic, kimono, swimsuit, bikini]
      known_stores: [amazon, walmart, target, best buy, home depot, lowe's,
                     costco, kohl's, macy's, nike, adidas, woot, ebay, sephora,
                     ulta, gap, old navy, wayfair, dell, lenovo, samsung, apple,
                     newegg, b&h photo, dick's sporting goods, rei, chewy, petco,
                     lego, walgreens, cvs, staples, nordstrom, zappos]
  site_dir: "site"
  custom_domain: "wowpriced.com"   # the site's one public address (canonical URLs, sitemap, IndexNow)
  exclude_suspect_msrp: true   # critic-flagged inflated list prices stay unpublished (kept in DB)
  ftc_disclosure: >-
    Disclosure: wowpriced is an independent service supported by affiliate commissions.
    We or the credited deal source may earn a small commission when you buy through
    our links, at no extra cost to you. This does not change which deals we show or
    their prices. Prices and availability may change.

affiliate:
  # The operator's Amazon Associates Store ID (e.g. "wowpriced-20"). "" = no
  # Amazon link is rewritten. With it, every https amazon.com "Get deal" link on the
  # site carries tag=<id> (publish/site.py rewrite_affiliate, the only place
  # links are rewritten); emails never do (Amazon forbids tagged links in
  # email), and the site's disclosure switches to the one below.
  amazon_tag: "wowpriced-20"
  # Other deal sites' click trackers: they earn for that site, not for us
  # (ranked lower, never posted to social).
  competitor_tracker_hosts: [cc.dealsofamerica.com, go.dealmoon.com,
                             slickdeals.net, links.southernsavers.com]
  # NEVER replace a source's own tracker with the store link: Deals of
  # America, DealMoon and Southern Savers gave crawl permission on the
  # condition that they keep their affiliate credit (sources.yaml
  # crawl_permission), and their tracker IS that credit. Operator's
  # agreements, 2026-10-10; repair switched off 2026-10-13.
  repair_competitor_trackers: false
  # eBay Partner Network campaign ID (operator, approved 2026-10-13; public,
  # it rides in every eBay link). Every https ebay.com Get deal link carries
  # our EPN parameters, before any Sovrn wrap. "" = off.
  ebay_campaign_id: "5339221823"
  # One store page -> one network short link ("<host>/<product id>"). Sovrn
  # onboarding (2026-10-12): its first-click check needs a click from our site.
  link_overrides:
    "walmart.com/222918738": "https://sovrn.co/168n3ev"
  # Sovrn Commerce (2026-10-12, site under review): non-Amazon retailer links
  # go through redirect.viglink.com. The link key is the GitHub secret
  # SOVRN_API_KEY (operator's call: not in the repo, though it travels inside
  # every Sovrn link); the reporting key SOVRN_SECRET_KEY never goes here.
  # On since 2026-10-12: the probe got a 302 to walmart.com with the link key.
  sovrn_enabled: true
  sovrn_key: ""
  disclosure: >-
    Disclosure: wowpriced is an independent service supported by affiliate commissions.
    We or the credited deal source may earn a small commission when you buy through
    our links, at no extra cost to you. This does not change which deals we show or
    their prices. Prices and availability may change. As an Amazon Associate,
    wowpriced earns from qualifying purchases.

extension:
  amazon_mode: full           # full | link; Amazon extension OK, amz378_998 (2026-10-16)

checker:
  enabled: false
  stores:
    amazon: history           # amazon_history: hide overrides this to link_only
    walmart: history          # operator permission, 2026-10-16
    ebay: live_only
    bestbuy: history
    target: history
    woot: history
    other: history
  ended_days: 90
  shards: 256

seo:
  event_pages:
    enabled: true
    events:
      - slug: black-friday
        name: Black Friday
        date: 2026-11-27
        window_days: [-28, 3]
        keywords: [black friday]
      - slug: cyber-monday
        name: Cyber Monday
        date: 2026-11-30
        window_days: [-28, 3]
        keywords: [cyber monday]
    min_items: 10
    max_items: 60
    intro: {black-friday: "", cyber-monday: ""}
  deal_pages_max: 3000        # Maximum live deal landing pages, best rank first.
  deal_pages_indexable: false # Keep shopper pages; focus search on durable listings.
  posted_deal_redirects:
    enabled: true            # Keep socially posted URLs useful after their deal pages disappear.
    max_rules: 1500          # Oldest redirects drop first; Cloudflare permits 2,000 static rules.
  # Operator 2026-10-17 ~04:20Z: "drop price history.. consumers don't care about that they
  # just want to see a big discount ... we might add price history one day but not today".
  # product_pages was on since 2026-10-15; private own checks keep recording, unpublished.
  product_pages:
    enabled: false
    record_own_checks:
      enabled: true
      max_per_offer_per_day: 1  # Enough for the 6-checks-over-7-days gate; keeps state small (~320 rows/day).
    min_checks: 6
    min_span_days: 7
    max_new_indexable_per_day: 50 # Pilot of the 200 best (operator 2026-10-16), admitted best-first.
    max_indexable: 200
    keep_days: 90
    prune_days: 180
    max_pages: 6000
    lower_ratio: 0.95         # Current / our 90-day median; equality is about usual.
    higher_ratio: 1.05
    deal_history_limit: 20    # Bound the visible deal list; facts use all stored deals.
  store_page_min_deals: 15    # Public live deals required for a store page.
  store_pages_max: 12         # Maximum store pages, most live deals first.
  price_page_min_deals: 10    # Public live deals required for a price page.
  price_pages: [10, 25, 50]   # Sale-price ceilings for price pages and home filter presets.
  home_min_items: 1          # Keep an empty wall out of search until offers return.
  best_today_min_items: 1
  deal_page_min_items: 1     # A single-deal page requires its live offer; ended stays noindex.
  # Category hubs (/deals/<slug>/): a hub is indexable and in the sitemap
  # only while it shows at least this many CURRENT public live offers.
  # Ended deals, locked counts and seven-day history never qualify it.
  # Below it the hub is noindex,follow and left out of the sitemap.
  hub_min_items: 10
  lastmod_retention_days: 35  # Keep absent URL fingerprints briefly; at most 50k URLs.
  # IndexNow (Bing, Yahoo, DuckDuckGo, Yandex). The key is public by design:
  # the site serves it at /<key>.txt to prove the domain is ours.
  indexnow_key: "89b51421654dec4627eb3ed0290d59b2"
  indexnow_min_hours: 6        # a changed URL is resubmitted at most this often
  # Periodic reminders start from an actual receipt. Failures retry separately.
  # 0 = never relist unchanged received URLs.
  indexnow_resubmit_days: 7
  indexnow_batch_size: 10000  # protocol maximum; one POST per run/endpoint
  indexnow_retry_initial_minutes: 15
  indexnow_retry_max_minutes: 360  # bounded exponential retry, including Retry-After

traffic:
  feed_enabled: true
  # Operator 2026-10-15: trimmed so copiers get little; readers click through to us.
  feed_max_items: 20          # Latest public live offers with emitted deal pages.
  feed_details: false         # Name, price, condition, credit, link; codes/steps stay on deal pages.
  share_enabled: true        # Detail pages only; no change to wall cards.
  related_hubs_enabled: true # Matching store and smallest qualifying price hub.
  hub_pagination_enabled: true # Crawlable 60-offer pages; each page keeps its hub's SEO floor.
  product_families_enabled: true # Exact stored identities only; no fuzzy or inferred models.
  product_family_min_offers: 3  # Distinct public live offers (minimum 2).

product_entities:
  backfill_per_run: 200      # Stored rows only; resumes without requests or LLM calls. 0 pauses.
  also_at_enabled: false    # Same-product, same-condition public offers on deal pages.
  lowest_seen_enabled: false # 30 days of verified product history; at least 3 UTC days.
  min_price_ratio: 0.4      # Comparison guard; may be tightened, never relaxed.
  max_price_ratio: 2.5
  shadow_retention_days: 7  # Private per-run reports, at most 30 sampled pairs each.

ranking:
  tier_boost: { corroborated: 15.0, history-checked: 10.0, unverified: 0.0 }
  abs_savings_weight: 0.1      # score += min(abs_savings, 100) * weight
  condition_penalty: 2.0       # per restrictive condition
  age_penalty_per_hour: 0.2

verify:
  corroborate_window_h: 24
  history_min_observations: 5  # need this many price points before history-checked can fire
  keepa_enabled: false         # legacy key, superseded by feature_flags.keepa

dedupe:
  fuzzy_threshold: 0.90        # token-sort ratio on normalized item names, same store

accuracy:
  extra_samples_per_day: 0       # optional random paid audits; existing reads are always reused

amazon_used:
  enabled: false  # operator 2026-10-19: Amazon only; Woot used/open-box stays

keepa:
  genuine_drops_only: true  # also verify 90-day drop, rank and adult exclusions in responses
  focus_pages_per_category: 2
  popular_affordable_page: false  # separate opt-in: one existing Amazon page slot
  unique_asin_rechecks:
    enabled: false               # share one product request within each compatible recheck group
  buybox_rule: on                 # operator 2026-10-17: "PRICES NEED TO BE RIGHT, NO COMPROMISE" (shadow probe: 18/30 top deals >10% under the Add-to-cart price)
  click_price_rule: "on"          # fresh qualified Buy Box required for plain new Amazon prices
  buybox_top_n: 120               # first N published wall positions; plain new Amazon only
  buybox_interval_min: 120         # paid requests and maximum Buy Box observation age
  recheck_surplus: true           # use predicted overflow before the next scheduled run
  recheck_surplus_reserve: 650     # 160 discovery + 120 top reads * 4 worst-case tokens, rounded up
  recheck_top_live_adaptive: true  # update=0 with surplus, otherwise update=1
  tokens_per_minute: 60           # change only this when upgrading the plan (60 since 2026-10-14)
  volatility:
    # Off 2026-10-14 ~19:50Z: live fast lanes ran out of time making many 1-4 ASIN
    # calls (used wall within 1 h fell 97% -> 57%). Back on 2026-10-15 with the
    # batching fix (Codex 101: full 20/100-ASIN calls sized to tokens and time;
    # simulation 100% top + used wall within 1 h, unused 73 tokens/h vs 942).
    # Roll back by setting false if a live fast lane runs out of time again.
    enabled: true
    # Maximum paid-request ages in hours; observation clocks remain separate.
    targets:
      FAST:   {top: 1.5, wall: 4, rest: 12, hidden: 48}
      NORMAL: {top: 1.5, wall: 4.5, rest: 18, hidden: 72}
      SLOW:   {top: 2, wall: 6, rest: 24, hidden: 72}
    # Reduce SLOW demand first, then NORMAL, then FAST. Protect NORMAL top
    # at two hours; exhausted budgets still defer reads and hide expired prices.
    stretch_limits: {SLOW: 1, NORMAL: 1.3333333333333333}
    # Before receipts exist, reserve the configured ordinary + overflow
    # /deal page ceiling (currently 160 tokens/run), not an assumed yield.
    discovery_history_runs: 12    # use saved actual feed receipts when available
    batching:
      offers_seconds: 6          # cold-start latency, including polite pacing
      stats_seconds: 1
      latency_margin: 1.2        # apply to observed p90 call times too
      time_margin_seconds: 5     # leave time for applying answers / saving state
    idle_lookahead_runs: 2        # overflow may cover the following run's deadline
    click_boost_per_run: 20       # only with first_party_clicks.enabled
    click_lookback_hours: 6        # already ingested hourly counts only
  # NEW discovery: six general pages -> twelve; two focus roots -> six,
  # two pages per root. At most 120 ordinary page tokens (was 40 new +
  # 60 Warehouse), plus the existing 40-token overflow allowance. Extra
  # pages keep the product reserve; first general page keeps existing minimums.
  # Warehouse settings remain for rollback, ignored while amazon_used is off.
  amazon_pages_per_pull: 12       # current NEW price >= min_pct below its 90-day average
  warehouse_pages_per_pull: 12
  reserve_tokens: 300              # never start an extra page below this
  visitor_reserve_tokens: 150      # extra floor across ALL pipeline calls for live searches
  # Legacy visibility cadences (used when volatility.enabled is false).
  recheck_fresh_h: 12               # deals first seen in the last recheck_fresh_window_h
  recheck_fresh_window_h: 24
  recheck_new_h: 24                 # ordinary rest; hidden recovery remains bounded
  recheck_used_h: 6                # ordinary top/wall used offers (up to 13 tokens)
  # Used scans (including suspects and click boosts) share this cap after
  # the deal reserve, under either scheduler.
  used_scan_budget_share: 0.35
  # Accuracy (operator, 2026-10-13: the site showed $3.65 while Amazon
  # showed $4.11). Correct plain new prices from the SAME paid reading,
  # with both Amazon averages; otherwise retain the existing kill tolerance.
  reprice_min_pct: 1
  recheck_top_h: 2              # top candidates; observation freshness is independently enforced
  recheck_tolerance_pct: 5
  # Saved visibility sets; an overdue top pick leads all volatility tiers.
  recheck_top_n: 200
  recheck_wall_n: 300              # top overlap is checked once
  recheck_wall_h: 6              # next 300 wall candidates
  # Task 085: spend predicted overflow before the next fast run on the
  # oldest visible confirmations. Due top/wall deadlines always lead.
  recheck_interval_minutes: 10     # forecast floor / ordinary retry gap; deadlines and lost answers override
  # Task 091: actual fast/hourly starts share one forecast. Slack accounts
  # for GitHub cron jitter; long outages cannot predict more than 45 minutes.
  recheck_gap:
    samples: 12
    ema_alpha: 0.3
    max_minutes: 45
    margin_minutes: 10
  # After top/wall deadlines, other due work and discovery, recover hidden
  # off-wall prices by pick value. Saved top/wall deadlines retain priority.
  # These lanes preserve the 300-token reserve as well as the deal reserve;
  # used scans also share used_scan_budget_share with the visible wall.
  hidden_new_tokens_per_run: 150   # stats-only, 1 token each; 0 disables
  hidden_used_scans_per_run: 10    # at most 13 tokens each; 0 = free feeds only
  # Surplus must not re-buy healthy rest prices inside 12 h; due top/wall
  # deadlines retain priority. Also the legacy scheduler's idle floor.
  recheck_idle_min_age_h: 12
  # Task 087b: after due checks, spend predicted overflow on discovery first,
  # then value-ranked early checks. Extra pages share the existing post caps.
  overflow_extra_pages_max: 8     # combined Amazon + Warehouse /deal pages per run
  recheck_wall_max_age_h: 6       # hard new-condition wall deadline, even when stable
  # Task 087 (docs/codex-tasks/087-value-per-token-rechecks.md): learn from
  # the last few distinct readings; preserve the 085 classes and reserves.
  recheck_adaptive:
    enabled: true                 # with volatility off, false restores fixed 085 cadence
    history_samples: 12           # compact facts only, per deal; daily totals retained separately
    prior_probability: 0.15       # chance of a useful change per ordinary cadence
    prior_readings: 4             # avoid overreacting to one reading
    exploration_share: 0.10       # oldest-visible sampling; legacy rounds its quota per batch
    visibility_boost: 1           # 1..2 weight from saved pick/wall position
    stable_multiplier: 2          # stable rows wait up to twice the ordinary cadence
    volatile_multiplier: 0.67     # volatile rows can run sooner
    min_new_h: 0.5
    min_used_h: 3                 # expensive offers scans stay bounded
    # Due one run BEFORE these ages. Existing pick/hide gates still apply.
    max_top_h: 2
    max_wall_h: 6
    max_rest_h: 24
    max_used_h: 4                 # task 087b: discovery must not age the visible used wall either
    used_deadline_margin_h: 0.5   # leave three runs to drain an expensive used queue
  # Operator request, 2026-10-13: feature only recently confirmed Amazon
  # prices; hide stale prices until confirmed, without killing their rows.
  pick_max_unconfirmed_h: 2
  show_max_unconfirmed_h: 24       # plain prices still need a <=2 h Buy Box confirmation
  # Used/open-box: off-wall units use free Warehouse sightings, plus the
  # small hidden-recovery allowance above once hidden.
  # 24 h until live counts (hidden_unconfirmed.used) say otherwise.
  show_max_unconfirmed_used_h: 24
  # Operator request, 2026-10-13: optional live top readings; default OFF.
  # update=0 can cost 2 tokens/new ASIN; batches reserve that worst case.
  # ON since 2026-10-14 (task 092 evidence): cached reads left Keepa's own
  # clock fresh within 1 h for only 40% of top picks although we asked 97%
  # within 45 min, so every run re-paid for them; ~300 tokens/h were also
  # going unused. Live reads make "price checked" truly recent for the most
  # seen prices, within the same 20/min plan (budget gates unchanged).
  recheck_top_live: true
  focus_categories: ["Beauty & Personal Care", "Health & Household", "Clothing, Shoes & Jewelry", "Baby Products", "Toys & Games", "Home & Kitchen"]  # empty = off
  # Reassign part of the old 10 new + 30 used intake cap to 20 new deals.
  # Existing parse/critic evidence and daily money caps still apply.
  amazon_max_new_posts_per_pull: 20
  warehouse_max_new_posts_per_pull: 30   # FRESH, DEEP and the sweep share it
  warehouse_min_drop_pct: 45       # used price this far under the HONEST new price
                                   # (5 points under publish.used_min_pct)
  warehouse_min_new_price: 25.0    # honest new price floor: no $10 phone cases
  # Amazon price drops quote the reference Amazon's own page shows
  # (operator, 2026-10-13: "go from that list price"). Amazon shows a List
  # Price only when customers recently bought at it, else a Typical price
  # (90-day median paid). We use the List Price when Amazon's 90-day
  # average reached this share of it; else the lower of the 30- and
  # 90-day averages.
  list_price_min_avg_ratio: 0.9
  # WAREHOUSE SWEEP: Keepa's product finder (products that HAVE a warehouse
  # offer, new price >= warehouse_min_new_price, rank <= 200000, best
  # sellers first; page window rotates via db meta keepa_sweep_page) plus
  # one batched /product check, ~11 + 1 token per ASIN. Lowest priority:
  # runs only while the bucket keeps reserve_tokens + sweep_reserve_tokens
  # after its cost, i.e. on idle tokens.
  sweep_enabled: true
  sweep_asins_per_pull: 100        # finder page size (Keepa minimum 50; one /product call holds 100)
  sweep_reserve_tokens: 400

woot:
  # Keep the single All request until the manual woot-probe verifies coverage.
  # feed_pages > 1 opts into ?page=2, ?page=3, ... on each feed; enable only
  # if the probe confirms that form returns new offers. Each feed stops on
  # an empty/short/repeated page. Named feeds must also be verified first.
  feed_pages: 1
  # Probe 2026-10-15: All returns 5,000 offers; these category feeds add
  # Home 2,305 / Clearance 1,987 / Tools 1,131 / Sports 1,108 / Electronics 372 /
  # Computers 343 offers All never lists. One feed per hour in turn keeps the
  # key far under its 1,000 requests/day (each category refreshed every 6 h).
  named_feeds: [Home, Clearance, Tools, Sports, Electronics, Computers]
  named_feeds_rotation_h: 1
  # One /feed/All GET per run (the key's quota is 1,000 requests/day). Every
  # offer is scored from its structured prices; offers within 5 points of
  # their publish floor (used_min_pct for anything not plainly new, min_pct
  # for new) are selected deepest-first, used before new, up to this cap.
  max_items_per_run: 300
  max_new_items_per_run: 40        # unseen posts per run, deepest first; the
                                   # rest of the selection rides later runs

telegram:
  channels: ["edealinfo"]      # public channels to READ via MTProto (hourly lane only)
  # A permission partner's channel is credited to that partner (sources.yaml
  # name), as its newsletter is; its credit link is the channel post.
  channel_sources:
    edealinfo: edealinfo       # operator 2026-10-15; its web feed is behind Cloudflare
  messages_per_minute: 15
  resend_price_drop_pct: 10    # re-alert only if price drops >=10% more
  dry_run: false               # true forces log-only even if credentials exist
  channel:                     # public deals channel (operator, 2026-10-12)
    posts_per_run: 1           # fast lane runs every 10 min
    daily_max: 24              # per America/New_York day
    min_gap_minutes: 30        # between two channel posts
    hours_local: [8, 23]       # post only from 08:00 to 22:59 New York
    min_age_minutes: 20        # deal page already live from an earlier deploy
    disclosure: "#ad"

members:
  # The paid product with no server of our own: Stripe hosts checkout (a
  # Payment Link), the pipeline reads the active subscriber list from Stripe
  # each run (STRIPE_SECRET_KEY secret, read-only key) and emails members one
  # bundle of every new verified deal per window via the SMTP_* secrets.
  # Operator call (2026-10-11): membership is website access only; no member
  # email is sent while email_enabled is false.
  email_enabled: false
  subscribe_url: "https://buy.stripe.com/14A5kE5LjgC01PN3zZeIw01"   # Stripe Payment Link (live)
  portal_url: ""             # Stripe customer-portal link (manage / cancel), shown on the welcome page
  # Operator call (2026-10-11): at most ONE member email a day. Any value
  # >= 1440 means one email per local day, sent on the first run at/after
  # email_hour_local (ahead of the free list's 8 am), carrying the best
  # max_deals_per_email of what arrived since the last one plus a "+N more
  # on the live wall" line. Below 1440 it is a rolling window and the hour
  # is ignored.
  email_every_minutes: 1440
  email_hour_local: 7
  timezone: "America/New_York"
  max_deals_per_email: 200   # ~46 KB of HTML at 200: under Gmail's ~102 KB clipping

engagement:
  new_since_visit: true
  weekly_finds: true
  visit_streak: true
  surprise_me: true
  hot_meter: true
  saved_deals: true       # browser-only saves and price watches, checked when you visit
  saved_deals_limit: 100   # browser-only shortlist; bounded to 1–200

pwa:
  enabled: true
  install_button: true
  install_phone_delay_s: 180  # operator 2026-10-17: phones show "App" after ~3 min on the site (summed across visits)
  name: "wowpriced"
  short_name: "wowpriced"
  android:
    enabled: false
    package: "com.wowpriced.app"  # permanent after the first Play upload
    sha256_cert_fingerprints: []  # Play app-signing cert first, then upload cert
    amazon_in_app: limited       # as_site requires written Associates app approval

join:
  prompt: true
  prompt_delay_s: 35       # operator 2026-10-17: 35 s (floor 15 in code), and only after engagement
  apple: false             # reserved; no Apple Developer account yet

support:
  enabled: true        # free site: Join free + Support; trial/membership UI hidden
  panel_delay_s: 120   # support panel also waits this long after page load; 0 = no delay
  cost_phrase: "thousands of dollars"
  monthly_link: "https://buy.stripe.com/7sY9AUflT5Xm2TR1rReIw03"     # monthly, $1 x the quantity the visitor picks (Stripe minimum 5 since 2026-10-13); empty hides it
  payment_link: "https://buy.stripe.com/8x2fZia1zadCfGD8UjeIw02"     # one-time, pay-what-you-want Stripe Payment Link; empty hides Support

paywall:
  # Visitors and free accounts see the top teaser_count deals in full; every
  # other live deal is a locked stub on the public site. The full payload is
  # POSTed to the Worker at api_url each render (NEWSLETTER_SECRET secret)
  # and served to members only: a Stripe subscription, trialing or active,
  # card on file (no card-less trial). See docs/paywall.md.
  enabled: true    # teaser deals.json + full payload uploaded to the Worker
  # Open access (operator, 2026-10-11): every visitor sees every deal in
  # full, nothing blurred. Sign-up, the trial button and "$0 today" stay;
  # copy that calls deals members-only switches to its open wording. The
  # free-8 rotation pauses and resumes where it was when this goes false.
  open_access: true
  teaser_count: 8          # unlocked deals for visitors
  teaser_pool: 0           # 0 = every live deal: a drop unlocks the best 8 not yet free; none
                           # is free again until every live deal had a turn (state.db meta)
  trial_days: 7            # page copy only; the Stripe trial is the Worker's TRIAL_DAYS: keep them equal
  yearly_price_usd: 49     # the Worker's STRIPE_YEARLY_PRICE_ID amount (the deploy checks it with Stripe); 0 hides yearly
  api_url: "https://wowpriced-subscribe.wowpriced.workers.dev"              # the Worker base URL, e.g. https://wowpriced-api.<sub>.workers.dev
  google_client_id: "242086574232-f057r0gmud5befbjk2cl6hofocr2mu45.apps.googleusercontent.com"     # public OAuth Web client ID; Google button hidden when empty

newsletter:
