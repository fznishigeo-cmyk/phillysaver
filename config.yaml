# dealradar runtime configuration (non-secret). Secrets come from environment variables only.

# Contact email advertised in the User-Agent, per our politeness policy.
# SET THIS before the first live run (robots-respecting crawlers must be contactable).
contact_email: "hello@wowpriced.com"
user_agent: "dealradar/0.1 (+https://github.com/fznishigeo-cmyk/phillysaver; contact: {contact_email})"

timezone: "America/New_York"   # default tz for feeds with naive dates and for "ends today"

quality:
  visitor_watch:
    # Read-only health monitor. Page-photo/All gates on: task 274 is live (7c882fc).
    category_photos: true
    deal_photos: true
    exclude_used_on_all: true
    # Exact photo hosts only, from publisher fixtures; no subdomain wildcards.
    image_hosts: [m.media-amazon.com, images-na.ssl-images-amazon.com, images.amazon.com,
                  i5.walmartimages.com, target.scene7.com, t.scene7.com, pisces.bbystatic.com,
                  d2b8wt72ktn9a2.cloudfront.net, d3gqasl9vmjfy8.cloudfront.net,
                  d3gqasl9vmjfd8.cloudfront.net,  # Woot photos as published (visitor watch #156)
                  dks.scene7.com, static.nike.com, hip2save.com, i0.wp.com]
  phone_budget:
    enabled: false             # proposed offline/lab gates; review before activation
    lab_lcp_max_ms: 2500
    lab_cls_max: 0.1
    # ceil(1.05 * largest task-206 fixed-fixture gzip size across four modes).
    home_html_gzip_max_bytes: 77360
    home_js_gzip_max_bytes: 53767
    home_css_gzip_max_bytes: 14913
    deals_json_gzip_max_bytes: 103976

fetch:
  parallel_sources: 1         # 1 = sequential; opt-in 2..6 independent web sources
  request_timeout_s: 20        # hard per-request timeout
  per_source_budget_s: 90      # hard per-source budget
  run_budget_s: 600            # hard 10 min per run; fetch ~5 min, parse ~3.5 min, publish ~1.5 min (hourly job timeout is 20 min)
  # No paid (LLM) call starts after this many seconds of pipeline time, in any
  # lane, and a run already past it when its paid work ends saves its state (the
  # spend ledger) before render. The hourly critic had no deadline; hourly runs
  # take 15-18 min of their 30 min job (2026-10-23): setup, render, sends and the
  # end-of-run save must still fit after it. The fast critic keeps its earlier stop.
  paid_work_stop_s: 840
  min_host_interval_s: 1.0     # <=1 request/sec per host
  max_retries: 3               # exponential backoff 1s, 2s, 4s (+jitter)
  circuit_breaker_failures: 3  # consecutive failures -> trip
  circuit_breaker_cooldown_h: 6
  redirect_max_hops: 5

audit:
  mode: shadow                 # enforce only after reviewing agreement by reason
  near_price_pct: 10           # recorded checkout prices near the claimed regular price
  history_min_near: 2          # plus verify.history_min_observations total checks
  history_min_span_h: 48
  extreme_pct: 85              # new, no clearance wording: needs a critic
  round_price_multiple: 50     # round reference without support: needs a critic
  reference_max_excess_pct: 10 # claimed regular above a stored Amazon reference: reject

appeal_score:
  enabled: true
  model: "claude-haiku-5-5"
  candidates: 120          # operator 2026-10-17: rate more of the wall (was 80)
  ttl_h: 72
  max_usd_per_run: 0.03
  max_usd_per_day: 0.40
  factors: {1: 0.6, 2: 0.8, 3: 1.0, 4: 1.1, 5: 1.2}

parse:
  # Primary extraction model. Haiku handles the first read of every post at
  # roughly a third of Sonnet's price — the volume work. Sonnet stays where
  # it earns its cost: the capped second opinion below (posts that smell like
  # deals but Haiku found nothing) and the deal critic. This tiering is what
  # keeps a full day of all-source sweeps inside the small daily cap.
  model: "claude-haiku-5-5"
  max_posts_per_run: 400
  max_chars_per_post: 6000
  spend_cap_usd_per_run: 0.50          # abort parsing gracefully when hit
  spend_cap_usd_per_day: 6.00          # hard daily ceiling across ALL runs (UTC day)
  # Operator-approved temporary raise (2026-10-14): $10/day "for the next
  # week, then we toggle down to $6" while cheaper parsing lands. The boost
  # applies only to UTC days before spend_cap_boost_until (through Oct 21),
  # then the $6 cap above is back on its own.
  spend_cap_boost_usd_per_day: 10.00
  spend_cap_boost_until: "2026-10-22"
  spend_pacing: true
  spend_pacing_headroom_hours: 2
  retries_on_invalid_json: 2
  # Extraction calls in flight at once. Each call is ~5-8 s of API round trip
  # regardless of model, so one-at-a-time capped a run at ~27 posts; a pool
  # of 6 lifts that toward ~150 per run. Spend caps still bound the total.
  concurrency: 6
  fast_lane_parse_budget_s: 150       # leave fast-lane time for judging and deploy
  # Observe simple, plainly below-floor price pairs before enabling any skips.
  prefilter_below_floor: shadow       # off | shadow | on
  # Proposed only; offline bounds/unknown cases: docs/bounded-prefilter.md.
  bounded_prefilter:
    enabled: false
    max_chars: 12000                 # analysis only; model cleaning stays at 6000
    max_numeric_chars: 32
    max_numeric_tokens: 128
    max_price_pairs: 256
  # Evidence for a later manual activation. Gaps longer than 90 minutes
  # make a UTC day incomplete; a matching offline supply replay is required.
  prefilter_readiness:
    complete_days: 7
    min_candidates: 200
    min_source_sites: 3
    max_gap_minutes: 90
  # Second opinion: when the cheap model finds no deals in a post that smells
  # like one AND its stated numbers can clear the lower site floor, re-read it once.
  second_opinion_model: "claude-sonnet-5-5"
  max_second_opinions_per_run: 8
  # Deal critic: before a deal publishes, a stronger model judges whether its
  # claimed regular price is a plausible real-world price (kills fake-MSRP junk).
  critic_model: "claude-sonnet-5-5"
  critic_enabled: true
  critic_batch_size: 8               # judge independent deals in one short reply
  # Share of each run's allowance kept for the critic: under pacing, new
  # posts may not use it all and let deals publish without the fake-MSRP check.
  critic_reserve_share: 0.5
  # Live deals still under "Other" (e.g. structured deals past a run's 60-title
  # category read) get one cheap title read each, this many per run.
  recategorize_other_per_run: 240
  critic_shadow_model: "claude-haiku-5-5"
  critic_shadow_batches_per_day: 12   # 0 disables comparison; never affects publishing
  # One switch restores the existing critic, shadow and second-opinion behavior.
  critic_tiering:
    enabled: true                   # operator 2026-10-15: "spend less per deal"
    model: "claude-haiku-5-5"
    # Operator 2026-10-22 ("do both on haiku"): Haiku's verdict is final for
    # every deal, front page and $250+ included. Sonnet only samples Haiku
    # approvals (shadow_batches_per_day); too many disagreements switch back
    # to Sonnet-for-all by themselves (max_disagreement).
    haiku_only: true
    max_tokens_per_deal: 160        # Haiku needs more output room; Sonnet stays unchanged
    min_confidence: 0.8
    high_price_usd: 250
    shadow_batches_per_day: 2       # Sonnet samples ordinary Haiku approvals
    window_deals: 32
    min_judged_deals: 16
    max_disagreement: 0.10          # above this: sticky Sonnet-for-all fallback
    # Operator 2026-10-22 ("use haiku ... so we can meet our $6 a day budget"):
    # 0 = every second opinion uses Haiku; the critic keeps Sonnet.
    second_opinion_calls_per_day: 0 # Sonnet calls, including retries
    second_opinion_yield_floor: 0.10 # evidence-backed posts / paid calls; strictly above
    second_opinion_min_calls: 3
    second_opinion_window_days: 7   # cold/low-yield sources use Haiku, same prompt
  # The models endpoint carries no prices, so "cheapest" is resolved as: the newest
  # haiku-family model from GET /v1/models (then sonnet, then any). Cost accounting for
  # the spend cap uses this table (USD per million tokens); unknown models use `default`.
  model_pricing_per_mtok:
    default: { input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10 }
    claude-haiku-5-5: { input: 0.10, output: 0.50, cache_write: 1.25, cache_read: 0.10 }
    claude-haiku-4-5: { input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 1.25, cache_read: 0.05 }

product_pages:
  ai_take:
    enabled: false             # review before activation; all numbers checked in code
    model: "claude-haiku-5-5"
    max_pages_per_run: 40
    max_usd_per_run: 0.05
    max_usd_per_day: 0.40
    max_words: 45

intake:
  mode: shadow                 # off | shadow | on; shadow never changes reads
  window_days: 7               # rolling useful yield, starting with 067/073 coverage
  min_history_hours: 24        # younger observations are unavailable, not zero yield
  min_posts: 20                # distinct handled posts before trusting a source's rate
  floor_share: 0.20            # equal floor across all eligible sources
  exploration_share: 0.20      # reserved for new/low-sample sources
  max_source_share: 0.25       # at least 1/N when fewer than four sources exist
  max_store_share: 0.50        # historical/structured store mix; unknown stores stay unknown
  max_wait_hours: 6            # overdue reads lead; existing time/spend/breaker caps still win

search:
  amazon_results: on          # operator approved 2026-10-17 7:55pm after testing ?preview=search
  cache_hours: 6
  tokens_per_day: 8000        # separate from pipeline recheck accounting; Nishi 2026-10-18 "raise it" (3,000 ran out at 1:45am; 5,000 again by 12:30pm, ad day)
                              # Keepa Starter (Nishi 2026-10-21): the bucket refills 28,800/day and the pipeline needs ~16,000;
                              # 8,000 = ~70 fresh searches a day (cached 6 h). Was 40,000 on the 60/min plan.
  max_per_minute: 4           # each search reserves up to 110 tokens; 4 keeps a burst under the 20/min refill's hour (was 20)

search_analyze:
