# dealradar runtime configuration (non-secret). Secrets come from environment variables only.

# Contact email advertised in the User-Agent, per our politeness policy.
# SET THIS before the first live run (robots-respecting crawlers must be contactable).
contact_email: "set-me@example.com"
user_agent: "dealradar/0.1 (+https://github.com/fznishigeo-cmyk/phillysaver; contact: {contact_email})"

timezone: "America/New_York"   # default tz for feeds with naive dates and for "ends today"

fetch:
  request_timeout_s: 20        # hard per-request timeout
  per_source_budget_s: 90      # hard per-source budget
  run_budget_s: 600            # hard 10 min per run; fetch ~5 min, parse ~3.5 min, publish ~1.5 min (hourly timeout is 15 min)
  min_host_interval_s: 1.0     # <=1 request/sec per host
  max_retries: 3               # exponential backoff 1s, 2s, 4s (+jitter)
  circuit_breaker_failures: 3  # consecutive failures -> trip
  circuit_breaker_cooldown_h: 6
  redirect_max_hops: 5

parse:
  # Primary extraction model. Haiku handles the first read of every post at
  # roughly a third of Sonnet's price — the volume work. Sonnet stays where
  # it earns its cost: the capped second opinion below (posts that smell like
  # deals but Haiku found nothing) and the deal critic. This tiering is what
  # keeps a full day of all-source sweeps inside the small daily cap.
  model: "claude-haiku-5-5"
  max_posts_per_run: 400
  max_chars_per_post: 6000
  spend_cap_usd_per_run: 0.50          # abort parsing gracefully when hit
  spend_cap_usd_per_day: 6.00          # hard daily ceiling across ALL runs (UTC day)
  retries_on_invalid_json: 2
  # Extraction calls in flight at once. Each call is ~5-8 s of API round trip
  # regardless of model, so one-at-a-time capped a run at ~27 posts; a pool
  # of 6 lifts that toward ~150 per run. Spend caps still bound the total.
  concurrency: 6
  # Second opinion: when the cheap model finds no deals in a post that smells
  # like one (has $ amounts / percents), re-read it once with a stronger model.
  second_opinion_model: "claude-sonnet-5-5"
  max_second_opinions_per_run: 8
  # Deal critic: before a deal publishes, a stronger model judges whether its
  # claimed regular price is a plausible real-world price (kills fake-MSRP junk).
  critic_model: "claude-sonnet-5-5"
  critic_enabled: true
  # The models endpoint carries no prices, so "cheapest" is resolved as: the newest
  # haiku-family model from GET /v1/models (then sonnet, then any). Cost accounting for
  # the spend cap uses this table (USD per million tokens); unknown models use `default`.
  model_pricing_per_mtok:
    default: { input: 1.00, output: 5.00 }
    claude-haiku-5-5: { input: 0.10, output: 0.50 }
    claude-haiku-4-5: { input: 1.00, output: 5.00 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00 }

publish:
  min_pct: 40                  # floor: pct_at_checkout (alerts + headline tier).
                               # Verification thresholds (history-checked, the
                               # Keepa cross-check) derive from this one knob.
  used_min_pct: 50             # HIGHER absolute floor for used/open-box deals
                               # (warehouse supply is plentiful; below this the
                               # page floods with mediocre used offers). The
                               # Keepa warehouse pass ingests from 5 points under.
  min_abs_savings: 5.0         # floor: absolute $ savings
  site_show_from_pct: 40       # site-only second tier: "strong deals" below the
                               # alert bar still render on the page (never
                               # alerted). Equal to min_pct = the tier is off.
  show_dead_hours: 48          # dead deals stay this long in the "Just
                               # missed" section at the page bottom (FOMO:
                               # gone before you got here)
  site_dir: "site"
  custom_domain: "wowpriced.com"   # GitHub Pages custom domain (CNAME file in every deploy)
  exclude_suspect_msrp: true   # critic-flagged inflated list prices stay unpublished (kept in DB)
  ftc_disclosure: >-
    Disclosure: some outbound links credit the deal source and may be affiliate links
    that earn the source (or, in the future, this site) a commission. Prices change
    fast and are not guaranteed.

ranking:
  tier_boost: { corroborated: 15.0, history-checked: 10.0, unverified: 0.0 }
  abs_savings_weight: 0.1      # score += min(abs_savings, 100) * weight
  condition_penalty: 2.0       # per restrictive condition
  age_penalty_per_hour: 0.2

verify:
  corroborate_window_h: 24
  history_min_observations: 5  # need this many price points before history-checked can fire
  keepa_enabled: false         # legacy key, superseded by feature_flags.keepa

dedupe:
  fuzzy_threshold: 0.90        # token-sort ratio on normalized item names, same store

telegram:
  channels: []                 # public channels to READ via MTProto, e.g. ["somepublicdealchannel"]
  messages_per_minute: 15
  resend_price_drop_pct: 10    # re-alert only if price drops >=10% more
  dry_run: false               # true forces log-only even if credentials exist

members:
  # The paid product with no server of our own: Stripe hosts checkout (a
  # Payment Link), the pipeline reads the active subscriber list from Stripe
  # each run (STRIPE_SECRET_KEY secret, read-only key) and emails members one
  # bundle of every new verified deal per window via the SMTP_* secrets.
  subscribe_url: "https://buy.stripe.com/14A5kE5LjgC01PN3zZeIw01"   # Stripe Payment Link (live)
  portal_url: ""             # Stripe customer-portal link (manage / cancel), shown on the welcome page
  email_every_minutes: 60    # at most one member email per hour; new deals queue for the next one

paywall:
  # Visitors see the top teaser_count deals in full; every other live deal
  # is a locked stub on the public site. The full payload is POSTed to the
  # Worker at api_url each render (NEWSLETTER_SECRET secret) and served to
  # members only. See docs/paywall.md.
  enabled: false   # OFF until the page and the Worker are live; then true
  teaser_count: 8          # unlocked deals for visitors
  trial_days: 7
  api_url: "https://wowpriced-subscribe.wowpriced.workers.dev"              # the Worker base URL, e.g. https://wowpriced-api.<sub>.workers.dev
  google_client_id: "242086574232-f057r0gmud5befbjk2cl6hofocr2mu45.apps.googleusercontent.com"     # public OAuth Web client ID; Google button hidden when empty

newsletter:
  # The FREE daily email list, with no server of our own: a Cloudflare
  # Worker + KV (cloudflare/subscribe-worker) holds the addresses, the
  # pipeline reads them through the Worker (NEWSLETTER_SECRET secret) and
  # sends one email per subscriber per day over the same SMTP_* secrets.
  enabled: true
  worker_url: "https://wowpriced-subscribe.wowpriced.workers.dev"             # printed by the "deploy subscribe worker" workflow; paste it here
  hour_local: 8              # first run at/after 08:00 local sends the day's email
  timezone: "America/New_York"
  max_per_run: 200           # messages per run; a longer list continues next run

digest:
  hour_local: 8                # 08:00 America/New_York
  timezone: "America/New_York"
  recipient: ""                # single recipient email; SMTP_* secrets configure transport

alerting:
  min_items_ratio: 0.5         # warn if run items < 50% of 7-day hourly average
  tripped_sources_warn: 5      # warn if >=5 sources tripped

retention:
  posts_seen_days: 30
  deals_days: 14

feature_flags:
  threads: false               # off until app review passes
  instagram: false             # stubbed
  keepa: true                  # inert until the KEEPA_KEY secret is set
