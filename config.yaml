  # Amazon's email: "remove walmart history as well please".
  walmart: live_only
  # Operator 2026-10-17: no price history for any store for now.
  ebay: live_only
  bestbuy: live_only
  target: live_only
  woot: live_only
  other: live_only

publish:
  amazon_reference: list_price  # history | list_price; comparisons stay private
  min_pct: 40                  # floor: pct_at_checkout (alerts + headline tier).
                               # Verification thresholds (history-checked, the
                               # Keepa cross-check) derive from this one knob.
  used_min_pct: 50             # HIGHER absolute floor for used/open-box deals
                               # (warehouse supply is plentiful; below this the
                               # page floods with mediocre used offers). The
                               # Keepa warehouse pass ingests from 5 points under.
  min_abs_savings: 5.0         # floor: absolute $ savings
  site_show_from_pct: 40       # site-only second tier: "strong deals" below the
                               # alert bar still render on the page (never
                               # alerted). Equal to min_pct = the tier is off.
  photoless_last: true        # photos first within each wall group; search stays unchanged
  hide_deal_site_links: true  # operator 2026-10-20: Get deal must open the store; credit by name
  photos:
    max_photoless_h: 1        # hide live cards without an HTTPS photo after this many hours (Nishi 2026-10-18: rows of photo-less new deals; was 3)
  reuse_link_facts:
    enabled: false           # reuse pure routing facts only within one publish
  show_dead_hours: 24          # confirmed-gone cards linger inline for one day
  amazon_as_of:
    enabled: true
  drop_minutes: 15             # the page's drop clock: minutes between drops.
                               # Set it to the real gap between publishes (the
                               # */10 cron lands every 11-15 min); a publish later
                               # than this shows "Next drop soon" until it lands.
  drop_clock: {warm_s: 300, hot_s: 120, final_s: 30}
  manifest_refresh:
    enabled: false
    force_full_after_s: 300     # full no-store backstop, including stale manifests
    max_bytes: 1024            # decoded manifest stream ceiling, before JSON parsing
    max_deals_bytes: 33554432   # reject implausible manifest sizes
    max_future_s: 300          # bounded clock skew for publication timestamps
  front_page:                 # Top picks and the clock-driven fresh page.
    fresh_page_size: 90
    used_tab_only: true         # used/open-box only in their tab and after new search matches
    broad_categories: [home, kitchen, beauty, fashion, health, grocery, kids_baby, toys_games, electronics, computers, gaming, pets, outdoors, sports]
    niche_categories: [auto, office, books_media, other]
    demote_words: [phone case, iphone case, galaxy case, pixel case, otterbox, spigen,
                  screen protector, tempered glass, replacement, replacement part,
                  toner, ink cartridge, filter cartridge, adapter plate, mounting bracket,
                  fuse, gasket, o-ring, hose clamp,
                  christmas, xmas,   # operator 2026-10-17 ("why do i still see the christmas tree"):
                  tupperware,        # operator 2026-10-17: "crap tupperware deal" (4 plastic shakers for $19.97)
                  officially licensed, nba, nhl, nfl, mlb, wnba, ncaa]   # 10-17 launch: 5 team sweatshirts in the first 24
