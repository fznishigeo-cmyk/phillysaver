      max_cards: 1
    appeal:                    # landing pick_score only; false restores the old order
      allure_first: 3           # first allure card may be card 3, then at most one in four
      allure_every: 4
      enabled: true
      niche_factor: 0.25        # clearly model-specific accessories/parts stay on the wall
      category_factors: {home: 1.15, kitchen: 1.15, beauty: 1.15, fashion: 1.15,
                         toys_games: 1.05, kids_baby: 1.05, health: 1.05, grocery: 1.05,
                         electronics: 1.15,   # operator 2026-10-17: gadgets entice ("where are the tech gadgets"); was 1.05
