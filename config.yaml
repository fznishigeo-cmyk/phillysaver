ads:
  # Only the operator's exact typed sentence may change authorized_daily_usd.
  # Nothing in code ever raises it. Copy the sentence verbatim into authorized_quote
  # and its ISO date into authorized_on. Example: AUTHORIZE ADS: $10 per day
  # Operator 2026-10-15: "go ahead and just turn off Google Ads. We need to start
  # saving some money." Cap 0 makes the guard pause every enabled campaign.
  authorized_daily_usd: 0       # 0 = no ad spend allowed
  authorized_on: ""
  authorized_quote: ""
  hard_max_daily_usd: 10       # absolute ceiling; excess authorization is clamped + alerted
  performance:
    lookback_days: 30         # completed days, matched Google Ads / GA4 dates
    zero_signup_cost_usd: 15
    min_deal_clicks: 10
    cost_per_deal_click_usd: 1.50
    cost_per_click_min_spend_usd: 20
  # One-time Search campaign builder (python -m dealradar ads-setup, manual
  # ads-setup.yml). It creates the campaign PAUSED and never touches an
  # existing one; the operator enables it in Google Ads. The budget must be
  # at most half the authorized cap (Google may spend 2x a daily budget).
  setup:
    campaign_name: "wowpriced search - generic deals"
    daily_budget_usd: 5
    max_cpc_usd: 0.40
    final_url: "https://wowpriced.com/"
    # Numeric campaign id so the guard can credit ad visitors (names cannot).
    final_url_suffix: "utm_source=google&utm_medium=cpc&utm_id={campaignid}&utm_campaign={campaignid}"
    keywords: ["deals today", "best deals today", "daily deals", "online deals", "price drop deals",
               "clearance deals", "open box deals", "used like new deals", "kitchen deals",
               "tech deals today"]     # phrase match
    # Broad negatives: store names (most programs ban bidding on them) and junk intent.
    negative_keywords: [amazon, walmart, target, best buy, ebay, woot, costco, kohls, macys,
                        wayfair, coupon code, promo code, jobs, login, near me]
    headlines: ["Today's Best Deals", "Verified Price Drops", "Prices Re-Checked All Day",
                "Real Discounts, No Fluff", "Used & Open-Box Bargains", "Home, Tech & Fashion Deals",
                "Expired Deals Removed Fast", "New Deals All Day"]
    descriptions:
      - "Every price is checked before it goes live. Expired deals come down fast."
      - "Thousands of live deals on home, tech, fashion and more. Free, no sign-up."
      - "We track price history so you only see real discounts. Updated all day."

