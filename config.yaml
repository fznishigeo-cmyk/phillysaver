    mix:                       # operator 2026-10-22: "7ish/30 sexy items ... 7ish/30 beauty ... 4ish essential ...
      enabled: true            # 3ish electronics ... 4ish kitchen and dining ... the rest what you think"
      per: 30                  # shares of every 30 front cards (Trending drops, Best deals today), interleaved;
      buckets:                 # a title's words decide before its category, earlier bucket first.
        sexy_for_her:          # operator 2026-10-22 ~23:59Z: "sexy items women wear for their partners", not gifts for him
          share: 7             # = the allure slots (card 3, then one in four): allure minus men's items
          groups: [allure]
          exclude_words: [cologne, boxer briefs, swim trunks, men, mens, boys]
        beauty:
          share: 7
          groups: [beauty]
          categories: [beauty]
          exclude_words: [air conditioner, nail gun]
        essentials:
          share: 4
          groups: [everyday]
          categories: [health, grocery]
        kitchen_dining:
          share: 4
          words: [cookware, dinnerware, dinner plates, plate set, mixing bowls, serving bowls, bowl set,
                  mug, mugs, drinking glasses, wine glasses, glassware, utensils, flatware, silverware,
                  cutlery, knife set, cutting board, food storage containers, air fryer, blender,
