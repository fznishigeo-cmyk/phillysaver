  # Operator 2026-10-23: "MAXIMIZE OUR TOKENS AND LIMITED WASTAGE". Measured 2026-10-22
  # (73 runs): ~5,900 tokens/day (~6,400/day at today's reserves; ~22% of the 20/min
  # plan) expired at the 1,200 cap;
  # the finder hit its 10-deal cap in 49 of 51 runs (2,299 qualifying rows dropped
  # as "cap") while spending ~25 of a median ~237 predicted idle tokens per run.
  # Was 0.7 / 10. Still overflow-only: due checks, reserves and AI caps unchanged.
  idle_share: 0.9 # shared surplus forecast, AFTER due checks and all reserves
  max_pages_per_run: 80  # 400 /deal tokens, plus one-time category resolution
  max_new_deals_per_run: 30 # existing evidence/critic and run/day AI caps still apply
  max_price: 50
  max_rank: 30000
  min_rating: 40  # tenths of stars; internal filter only
  min_reviews: 50 # internal filter only; never saved in a post/public artifact
  # Names, not guessed IDs. Search the leaf then verify its parent path once.
  # Paths can omit intermediate nodes; names must occur in this order.
