  endpoint: "https://wowpriced-subscribe.wowpriced.workers.dev"  # same as newsletter.worker_url; cookie-free origin
  hourly_cap: 1000  # atomic across isolates; hard maximum 3000 (72k D1 writes/day)
  isolate_per_minute: 120
  deal_per_minute: 12
  retention_days: 30  # local aggregates; Worker keeps 7 days for bounded catch-up
  lookback_hours: 168
  max_publish_gap_minutes: 30  # longer gaps have unknown publication exposure
  prior_hours: 2
  shadow_weight: 10  # positions per log(1 + clicks/(shown hours + prior))

# Hourly site check (scripts/site_check.js): photo floors that turn the run red,
# so the failure watch catches missing photos before a visitor does (operator
# 2026-10-15: "we need 99.99% of images showing up!"). Live 2026-10-15 21:11Z:
# 93% showing, 0 broken, 24 of the top 24 cards with a photo. Task 283 hides
# older photo-less cards and raises the showing floor to 99%.
site_check:
  min_photo_pct: 98         # live deals whose photo shows; new deals get 3 h to find one (publish.photos); live 98.3-98.8% on 10-17
  max_broken: 10            # deals whose photo fails to load
  first_screen_photos: 24   # of the top 24 cards on the home page

compare:                   # task 256: best value finder (Keepa only; filters never displayed)
  refresh: true            # operator 2026-10-17: preview with real prices (caps below bound Keepa use)
  publish: "preview"       # off | preview | on; preview = /compare/ pages, noindex, no menu link, not in the sitemap
  terms_file: data/compare_terms.yaml
  candidates_per_term: 20
  refresh_hours: 12
  finder_days: 7
  min_rating: 40           # finder filter only; never displayed
  min_reviews: 50          # finder filter only; never displayed
  prime_only: true
  tokens_per_day: 6000
  tokens_per_run: 300
  finder_reserve_tokens: 30  # upper bound reserved before dispatch; oversized receipts halt this UTC day
  min_bucket_share: 0.8
  max_seconds_per_run: 20
  request_timeout_s: 5     # compare calls only; leave room for pacing and the next call
  max_price_age_h: 24
