images:
  post_ingest_keepa: true    # Catch exact-ASIN photos missed by the fetch-time recheck; existing caps/reserves.
  asin_backfill_per_run: 60   # offline identity repairs, plus existing Amazon link pass; once per deal
  short_links_per_run: 10     # additional amzn.to/a.co chains, HEAD only
  keepa_search_per_run: 10
  # Per search: 10 + ceil(50 / 100) finder + up to 50 product reads = 61 tokens.
  # Operator 2026-10-23 ("limited wastage"): on 2026-10-22 all 120 searches paid the
  # 11-token finder fee and none matched a photo (1,313 tokens, 0 photos). Was 120;
  # a small daily sample keeps photo_search measurable (~130 tokens/day).
  keepa_search_per_day: 12    # UTC; shares Keepa budget, after price rechecks
  keepa_match_min: 0.85       # strict photo-only title matches
