# dealradar runtime configuration (non-secret). Secrets come from environment variables only.

# Contact email advertised in the User-Agent, per our politeness policy.
# SET THIS before the first live run (robots-respecting crawlers must be contactable).
contact_email: "hello@wowpriced.com"
user_agent: "dealradar/0.1 (+https://github.com/fznishigeo-cmyk/phillysaver; contact: {contact_email})"

timezone: "America/New_York"   # default tz for feeds with naive dates and for "ends today"

fetch:
  request_timeout_s: 20        # hard per-request timeout
  per_source_budget_s: 90      # hard per-source budget
  run_budget_s: 600            # hard 10 min per run; fetch ~5 min, parse ~3.5 min, publish ~1.5 min (hourly timeout is 15 min)
  min_host_interval_s: 1.0     # <=1 request/sec per host
  max_retries: 3               # exponential backoff 1s, 2s, 4s (+jitter)
  circuit_breaker_failures: 3  # consecutive failures -> trip
  circuit_breaker_cooldown_h: 6
  redirect_max_hops: 5

parse:
  # Primary extraction model. Haiku handles the first read of every post at
  # roughly a third of Sonnet's price — the volume work. Sonnet stays where
  # it earns its cost: the capped second opinion below (posts that smell like
  # deals but Haiku found nothing) and the deal critic. This tiering is what
  # keeps a full day of all-source sweeps inside the small daily cap.
  model: "claude-haiku-5-5"
  max_posts_per_run: 400
  max_chars_per_post: 6000
  spend_cap_usd_per_run: 0.50          # abort parsing gracefully when hit
  spend_cap_usd_per_day: 6.00          # hard daily ceiling across ALL runs (UTC day)
  # Operator-approved temporary raise (2026-10-11): $15/day for 3 days while
  # the used/open-box backlog drains, then back to the $6 base automatically
  # (the boost applies only to UTC days before spend_cap_boost_until).
  spend_cap_boost_usd_per_day: 15.00
  spend_cap_boost_until: "2026-10-14"
  retries_on_invalid_json: 2
  # Extraction calls in flight at once. Each call is ~5-8 s of API round trip
  # regardless of model, so one-at-a-time capped a run at ~27 posts; a pool
  # of 6 lifts that toward ~150 per run. Spend caps still bound the total.
  concurrency: 6
  # Second opinion: when the cheap model finds no deals in a post that smells
  # like one (has $ amounts / percents), re-read it once with a stronger model.
  second_opinion_model: "claude-sonnet-5-5"
  max_second_opinions_per_run: 8
  # Deal critic: before a deal publishes, a stronger model judges whether its
  # claimed regular price is a plausible real-world price (kills fake-MSRP junk).
  critic_model: "claude-sonnet-5-5"
  critic_enabled: true
  # The models endpoint carries no prices, so "cheapest" is resolved as: the newest
  # haiku-family model from GET /v1/models (then sonnet, then any). Cost accounting for
  # the spend cap uses this table (USD per million tokens); unknown models use `default`.
  model_pricing_per_mtok:
    default: { input: 1.00, output: 5.00 }
    claude-haiku-5-5: { input: 0.10, output: 0.50 }
    claude-haiku-4-5: { input: 1.00, output: 5.00 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00 }

publish:
  min_pct: 40                  # floor: pct_at_checkout (alerts + headline tier).
                               # Verification thresholds (history-checked, the
                               # Keepa cross-check) derive from this one knob.
  used_min_pct: 50             # HIGHER absolute floor for used/open-box deals
                               # (warehouse supply is plentiful; below this the
                               # page floods with mediocre used offers). The
                               # Keepa warehouse pass ingests from 5 points under.
  min_abs_savings: 5.0         # floor: absolute $ savings
  site_show_from_pct: 40       # site-only second tier: "strong deals" below the
                               # alert bar still render on the page (never
                               # alerted). Equal to min_pct = the tier is off.
  show_dead_hours: 48          # dead deals stay this long in the "Just
                               # missed" section at the page bottom (FOMO:
                               # gone before you got here)
  drop_minutes: 15             # the page's drop clock: minutes between drops.
                               # Set it to the real gap between publishes (the
                               # */10 cron lands every 11-15 min); a publish later
                               # than this shows "Next drop soon" until it lands.
  site_dir: "site"
  custom_domain: "wowpriced.com"   # the site's one public address (canonical URLs, sitemap, IndexNow)
  exclude_suspect_msrp: true   # critic-flagged inflated list prices stay unpublished (kept in DB)
  ftc_disclosure: >-
    Disclosure: some outbound links credit the deal source and may be affiliate links
    that earn the source a commission. Prices change fast and are not guaranteed.

affiliate:
  # The operator's Amazon Associates Store ID (e.g. "wowpriced-20"). "" = no
  # link is rewritten. With it, every https amazon.com "Get deal" link on the
  # site carries tag=<id> (publish/site.py rewrite_affiliate, the only place
  # links are rewritten); emails never do (Amazon forbids tagged links in
  # email), and the site's disclosure switches to the one below.
  amazon_tag: ""
  disclosure: >-
    Disclosure: some links are affiliate links; wowpriced or the deal source may
    earn a commission when you buy, at no extra cost to you. As an Amazon
    Associate, wowpriced earns from qualifying purchases. Prices change fast and
    are not guaranteed.

seo:
  # Category hubs (/deals/<slug>/): a hub is indexable and in the sitemap
  # only while its category had at least this many deals pass our checks in
  # the last 7 days (a stable count: never the rotating free deals or the
  # locked count). Below it the hub is noindex and left out of the sitemap.
  hub_min_items: 10
  # IndexNow (Bing, Yahoo, DuckDuckGo, Yandex). The key is public by design:
  # the site serves it at /<key>.txt to prove the domain is ours.
  indexnow_key: "89b51421654dec4627eb3ed0290d59b2"
  indexnow_min_hours: 6        # a changed URL is resubmitted at most this often
  # A URL counts as submitted once a publish lists it (before the POST runs),
  # so an unchanged URL is listed again after this many days: a failed POST
  # heals within a week instead of never. 0 = never relist unchanged URLs.
  indexnow_resubmit_days: 7

ranking:
  tier_boost: { corroborated: 15.0, history-checked: 10.0, unverified: 0.0 }
  abs_savings_weight: 0.1      # score += min(abs_savings, 100) * weight
  condition_penalty: 2.0       # per restrictive condition
  age_penalty_per_hour: 0.2

verify:
  corroborate_window_h: 24
  history_min_observations: 5  # need this many price points before history-checked can fire
  keepa_enabled: false         # legacy key, superseded by feature_flags.keepa

dedupe:
  fuzzy_threshold: 0.90        # token-sort ratio on normalized item names, same store

keepa:
  # The /deal lane on the 20 token/min plan (~200 tokens per 10-minute
  # pull). Each /deal page is 150 rows for ~5 tokens. Only the Amazon and
  # FRESH first pages run on a near-empty bucket (10 tokens); every further
  # page only while reserve_tokens stay untouched for the product calls
  # (price rechecks, photos). Paging also stops on a short page, a 429, the
  # time budget, the page cap or the new-post cap below.
  amazon_pages_per_pull: 6         # Amazon's own price >=35% under its 90-day average
  warehouse_pages_per_pull: 12     # a third FRESH (newest warehouse deals first),
                                   # the rest DEEP (90-day list; its page window
                                   # rotates across pulls via db meta keepa_deep_page)
  reserve_tokens: 300              # never start an extra page below this
  # NEW posts (not yet content-hashed: each costs an LLM parse, a critic
  # call and a keepa_check) emitted per pull; posts already handled ride
  # free and the rest arrive over the next pulls. Bounds the first pulls
  # after a deploy (every Keepa hash changes, Woot's selection is new):
  # with woot.max_new_items_per_run, at most 10 + 30 + 40 = 80 new posts a
  # run. Live 2026-10-11 07:00 run: 75 new posts parsed in ~80 s; the run
  # took 506 s only because link resolution sat ~330 s in store backoff,
  # now one quick try per hop inside a 60 s budget. 80 posts fit the fast
  # job's 12-minute timeout with room to spare.
  amazon_max_new_posts_per_pull: 10
  warehouse_max_new_posts_per_pull: 30   # FRESH, DEEP and the sweep share it
  warehouse_min_drop_pct: 45       # used price this far under the HONEST new price
                                   # (5 points under publish.used_min_pct)
  warehouse_min_new_price: 25.0    # honest new price floor: no $10 phone cases
  # WAREHOUSE SWEEP: Keepa's product finder (products that HAVE a warehouse
  # offer, new price >= warehouse_min_new_price, rank <= 200000, best
  # sellers first; page window rotates via db meta keepa_sweep_page) plus
  # one batched /product check, ~11 + 1 token per ASIN. Lowest priority:
  # runs only while the bucket keeps reserve_tokens + sweep_reserve_tokens
  # after its cost, i.e. on idle tokens.
  sweep_enabled: true
  sweep_asins_per_pull: 100        # finder page size (Keepa minimum 50; one /product call holds 100)
  sweep_reserve_tokens: 400

woot:
  # One /feed/All GET per run (the key's quota is 1,000 requests/day). Every
  # offer is scored from its structured prices; offers within 5 points of
  # their publish floor (used_min_pct for anything not plainly new, min_pct
  # for new) are selected deepest-first, used before new, up to this cap.
  max_items_per_run: 300
  max_new_items_per_run: 40        # unseen posts per run, deepest first; the
                                   # rest of the selection rides later runs

telegram:
  channels: []                 # public channels to READ via MTProto, e.g. ["somepublicdealchannel"]
  messages_per_minute: 15
  resend_price_drop_pct: 10    # re-alert only if price drops >=10% more
  dry_run: false               # true forces log-only even if credentials exist

members:
  # The paid product with no server of our own: Stripe hosts checkout (a
  # Payment Link), the pipeline reads the active subscriber list from Stripe
  # each run (STRIPE_SECRET_KEY secret, read-only key) and emails members one
  # bundle of every new verified deal per window via the SMTP_* secrets.
  # Operator call (2026-10-11): membership is website access only; no member
  # email is sent while email_enabled is false.
  email_enabled: false
  subscribe_url: "https://buy.stripe.com/14A5kE5LjgC01PN3zZeIw01"   # Stripe Payment Link (live)
  portal_url: ""             # Stripe customer-portal link (manage / cancel), shown on the welcome page
  # Operator call (2026-10-11): at most ONE member email a day. Any value
  # >= 1440 means one email per local day, sent on the first run at/after
  # email_hour_local (ahead of the free list's 8 am), carrying the best
  # max_deals_per_email of what arrived since the last one plus a "+N more
  # on the live wall" line. Below 1440 it is a rolling window and the hour
  # is ignored.
  email_every_minutes: 1440
  email_hour_local: 7
  timezone: "America/New_York"
  max_deals_per_email: 200   # ~46 KB of HTML at 200: under Gmail's ~102 KB clipping

paywall:
  # Visitors and free accounts see the top teaser_count deals in full; every
  # other live deal is a locked stub on the public site. The full payload is
  # POSTed to the Worker at api_url each render (NEWSLETTER_SECRET secret)
  # and served to members only: a Stripe subscription, trialing or active,
  # card on file (no card-less trial). See docs/paywall.md.
  enabled: true    # teaser deals.json + full payload uploaded to the Worker
  # Open access (operator, 2026-10-11): every visitor sees every deal in
  # full, nothing blurred. Sign-up, the trial button and "$0 today" stay;
  # copy that calls deals members-only switches to its open wording. The
  # free-8 rotation pauses and resumes where it was when this goes false.
  open_access: true
  teaser_count: 8          # unlocked deals for visitors
  teaser_pool: 0           # 0 = every live deal: a drop unlocks the best 8 not yet free; none
                           # is free again until every live deal had a turn (state.db meta)
  trial_days: 7            # page copy only; the Stripe trial is the Worker's TRIAL_DAYS: keep them equal
  yearly_price_usd: 49     # the Worker's STRIPE_YEARLY_PRICE_ID amount (the deploy checks it with Stripe); 0 hides yearly
  api_url: "https://wowpriced-subscribe.wowpriced.workers.dev"              # the Worker base URL, e.g. https://wowpriced-api.<sub>.workers.dev
  google_client_id: "242086574232-f057r0gmud5befbjk2cl6hofocr2mu45.apps.googleusercontent.com"     # public OAuth Web client ID; Google button hidden when empty

newsletter:
  # The free sign-up list, with no server of our own: a Cloudflare
  # Worker + KV (cloudflare/subscribe-worker) holds the addresses, the
  # pipeline reads them through the Worker (NEWSLETTER_SECRET secret) and
  # sends one email per subscriber per day over the same SMTP_* secrets.
  # Operator call (2026-10-11): that email is the day's top_n deals, picked
  # once a day by the parse model (parse.model) from the best 40 by rank,
  # under the same spend caps (rank order when it can't run). Members get
  # every deal. The site copy says "top 10": keep them equal.
  enabled: false   # operator call (2026-10-11): no daily emails for anyone
  worker_url: "https://wowpriced-subscribe.wowpriced.workers.dev"             # printed by the "deploy subscribe worker" workflow; paste it here
  hour_local: 8              # first run at/after 08:00 local sends the day's email
  timezone: "America/New_York"
  max_per_run: 200           # messages per run; a longer list continues next run
  top_n: 10                  # deals per email (the page copy says "top 10")

tracking:
  # Analytics and ad tags (dealradar/publish/tracking.py). Public IDs only,
  # never secrets; paste each one quoted. Empty = that tag is not on any
  # page; all empty = no page makes a third-party request. A value that does
  # not look like a real ID is skipped with a warning. The ad pixels never
  # load for a visitor whose browser sends Global Privacy Control or who
  # opted out on /privacy.html; GA4 then runs without its ad features.
  # In each partner's settings keep automatic event detection and automatic
  # advanced matching off (Meta, TikTok, Pinterest, Microsoft) and GA4's
  # Enhanced measurement > Outbound clicks off: they would report what the
  # page shows (a member's deal links, a typed email). The site's own events
  # already cover sign-up, checkout, trial and deal clicks.
  ga4_measurement_id: "G-MHLJXK2WHF"  # Google Analytics 4, "G-XXXXXXXXXX"
  meta_pixel_id: "1634493648070496" # Meta (Facebook/Instagram) Pixel, digits
  tiktok_pixel_id: ""               # TikTok Pixel code, letters and digits
  pinterest_tag_id: ""              # Pinterest Tag, digits
  google_ads_id: ""                 # Google Ads, "AW-123456789"
  google_ads_trial_label: ""        # the Google Ads conversion label for start_trial
  bing_uet_id: ""                   # Microsoft Advertising UET tag, digits
  # Site-ownership checks: the content value of each meta tag, on every page.
  google_site_verification: ""      # google-site-verification
  bing_site_verification: ""        # msvalidate.01 (32 hex characters)
  pinterest_domain_verify: ""       # p:domain_verify (32 hex characters)
  facebook_domain_verification: ""  # facebook-domain-verification

digest:
  hour_local: 8                # 08:00 America/New_York
  timezone: "America/New_York"
  recipient: ""                # single recipient email; SMTP_* secrets configure transport

alerting:
  min_items_ratio: 0.5         # warn if run items < 50% of 7-day hourly average
  tripped_sources_warn: 5      # warn if >=5 sources tripped

growth:
  # The daily PRIVATE growth report (python -m dealradar growth-report,
  # .github/workflows/growth-report.yml): GA4, Search Console (+ a daily
  # sitemap submit), Meta ads/followers and Stripe, sent to the operator by
  # email (REPORT_EMAIL_TO secret, else contact_email) and/or the Telegram
  # admin chat. Secrets: GOOGLE_SA_JSON, META_SYSTEM_TOKEN, STRIPE_SECRET_KEY,
  # GOOGLE_ADS_*.
  # Read-only everywhere. An empty value (or a missing secret) skips its section.
  report_days: 7
  ga4_property_id: "558475393"               # numeric GA4 property ID (Admin -> Property details)
  search_console_site: "sc-domain:wowpriced.com"
  sitemap_url: ""                            # "" = https://<publish.custom_domain>/sitemap.xml
  # Pinned Graph API version (v24.0, released 2025-10; Meta keeps a version
  # about two years). Bump it when Meta announces its deprecation.
  meta_graph_version: "v24.0"
  meta_ad_account_id: ""                     # digits, with or without "act_"
  meta_page_id: ""                           # Facebook Page ID (followers)
  instagram_user_id: ""                      # Instagram professional account ID (followers)
  # Google Ads (secrets GOOGLE_ADS_CLIENT_ID, GOOGLE_ADS_CLIENT_SECRET,
  # GOOGLE_ADS_REFRESH_TOKEN; OAuth client in Cloud project wowpriced-511321).
  # Pinned API version: Google keeps each about a year; bump it when it is
  # announced for sunset.
  google_ads_api_version: "v25"   # v26 answers "Method not found" for this project (2026-10-12)
  google_ads_customer_id: "441-227-5803"       # the wowpriced ad account (reached directly)
  google_ads_login_customer_id: ""             # manager 586-101-9939 holds no accounts yet; "" = direct
  monthly_price_usd: 9.99                    # MRR fallback; annual prices count as amount / 12

retention:
  posts_seen_days: 30
  deals_days: 14             # DEAD deals are deleted this long after they died; a live deal is never removed for its age

feature_flags:
  threads: false               # off until app review passes
  instagram: false             # stubbed
  keepa: true                  # inert until the KEEPA_KEY secret is set
