  # Nothing in code ever raises it. Copy the sentence verbatim into authorized_quote
  # and its ISO date into authorized_on. Example: AUTHORIZE ADS: $10 per day
  # Operator 2026-10-15: "go ahead and just turn off Google Ads. We need to start
  # saving some money." Cap 0 makes the guard pause every enabled campaign.
  # Operator 2026-10-22 ~00:55Z typed: "AUTHORIZE ADS: $10 per day (KEEP AD PAUSED,
  # I WILL UNPAUSE IT)" -> cap $10; the deal-tools campaign is created PAUSED and
  # only the operator enables it.
  authorized_daily_usd: 10      # 0 = no ad spend allowed
  authorized_on: "2026-10-22"
  authorized_quote: "AUTHORIZE ADS: $10 per day"
  hard_max_daily_usd: 10       # absolute ceiling; excess authorization is clamped + alerted
  performance:
    lookback_days: 30         # completed days, matched Google Ads / GA4 dates
    zero_signup_cost_usd: 15
    min_deal_clicks: 10
    cost_per_deal_click_usd: 1.50
    cost_per_click_min_spend_usd: 20
  # One-time Search campaign builder (python -m dealradar ads-setup, manual
  # ads-setup.yml). It creates the campaign PAUSED and never touches an
  # existing one; the operator enables it in Google Ads. The budget must be
  # at most half the authorized cap (Google may spend 2x a daily budget).
  # update_ads (--update-ads) only swaps each ad group's responsive search ad
  # headlines/descriptions for the copy below; nothing else changes.
  setup:
    # 2026-10-22 (operator): Search ad for the two free tools. The earlier "generic
    # deals" campaign (2026-10-15) stays paused as it is. No keyword may contain
    # "amazon" (Associates paid-search policy) and nothing promises review checks.
    campaign_name: "wowpriced search - deal tools"
    daily_budget_usd: 5
    max_cpc_usd: 0.40
    final_url: "https://wowpriced.com/amazon-deal-checker/"
    # Numeric campaign id so the guard can credit ad visitors (names cannot).
    final_url_suffix: "utm_source=google&utm_medium=cpc&utm_id={campaignid}&utm_campaign={campaignid}"
    keywords: ["deal checker", "is this a good deal", "is it a good deal", "price checker",
               "price history checker", "price drop checker", "discount finder", "real discounts",
               "best discounts today", "price tracker"]     # phrase match
    # Broad negatives: store names (most programs ban bidding on them) and junk intent.
    negative_keywords: [amazon, walmart, target, best buy, ebay, woot, costco, kohls, macys,
                        wayfair, coupon code, promo code, jobs, login, near me]
    # Operator 2026-10-23 ("WHY NOT A+"): Google rates an ad Excellent with 15
    # headlines (<= 30 characters) and 4 descriptions (<= 90), unique, keywords in
    # several headlines. Never Amazon or its marks, other brands, prices, numbers,
    # "best" or "!" (ads_setup enforces it). Plain words that match the landing page.
    headlines: ["Is This a Good Deal?", "Free Online Deal Checker", "Simple Price Checker Tool",
                "Free Discount Finder Tool", "Find Real Discounts Fast", "See Real Price Drops",
                "Check a Price in Seconds", "Know Before You Buy", "Prices Re-Checked All Day",
                "No Sign-Up or Extension", "Paste a Link, See the Verdict", "Compare With the List Price",
                "Shop With More Confidence", "Works on Phone and Computer", "Deal Checker by wowpriced"]
    descriptions:
      - "Paste a product link and see if today's price is really a deal. Free, no sign-up."
      - "Find real price drops on everyday products. Prices re-checked all day, free to use."
      - "We compare today's price with the list price and our verified deals in seconds."
      - "Works on your phone or computer. No extension to install. Shop with more confidence."
    # 2026-10-22 (operator: "used key words like fakespot, reviewmeta, price checker,
    # review checker etc?"): one ad group per new tool, added PAUSED to the SAME
    # campaign and budget (no new money); the operator enables them. Brand names
    # may be keywords but never ad text; nothing promises fake-review detection and
    # no ad text is negative about products or discounts.
    ad_groups:
      - name: "deal spotter"
        final_url: "https://wowpriced.com/deal-spotter/"
        keywords: ["fakespot", "fake spot", "fakespot alternative", "deal grader",
                   "fake discount checker", "is this discount real", "deal spotter"]
        headlines: ["Deal Spotter by wowpriced", "Try the Free Deal Spotter", "Free Deal Grader: A, B or C",
                    "Spot Great Deals Fast", "Is It a Great Price?", "Is This Discount Worth It?",
                    "Great, Good or Fair Price?", "Paste a Link, Get a Grade", "Check a Price in Seconds",
                    "Grade a Deal Before You Buy", "Free. No Extension Needed", "No Sign-Up Needed",
                    "Works on Phone and Computer", "See Today's Verified Deals", "Buy With More Confidence"]
        descriptions:
          - "Paste a product link and get an A, B or C grade for the price in seconds. Free."
          - "See if today's price is a great deal before you buy. Free, no extension needed."
          - "The grade weighs today's price, not just the list price. Works on phone or computer."
          - "Spot great deals in seconds and shop with more confidence. No sign-up needed."
      - name: "review checker"
        final_url: "https://wowpriced.com/review-checker/"
        keywords: ["review checker", "reviewmeta", "review meta", "reviewmeta alternative",
                   "product review checker", "review grader", "check product reviews"]
        headlines: ["Free Review Checker", "Review Checker by wowpriced", "Product Review Checker",
                    "Check Review Signals Fast", "Free Review Grader Tool", "A, B or C Review Grade",
                    "Review Signals at a Glance", "Paste a Link, Get a Grade", "Is the Rating Holding Steady?",
                    "Check Reviews Before You Buy", "Plain Answers, Clear Grade", "Free. No Sign-Up Needed",
                    "No Extension Needed", "Works on Any Device", "Shop With More Confidence"]
        descriptions:
          - "Paste a product link and see its review signals with a simple A, B or C grade. Free."
          - "See rating steadiness, review pace and popularity in seconds. No extension needed."
          - "Check the review signals before you buy: a clear grade and the checks it passed."
          - "Free on your phone or computer, with no sign-up. Shop with a little more confidence."

