first_party_clicks:
  enabled: true   # operator approved 2026-10-14 ("listen for used items"); CLICK_SIGNAL_TOKEN added
  endpoint: "https://wowpriced-subscribe.wowpriced.workers.dev"  # same as newsletter.worker_url; cookie-free origin
  hourly_cap: 1000  # atomic across isolates; hard maximum 3000 (72k D1 writes/day)
  isolate_per_minute: 120
  deal_per_minute: 12
  retention_days: 30  # local aggregates; Worker keeps 7 days for bounded catch-up
  lookback_hours: 168
  max_publish_gap_minutes: 30  # longer gaps have unknown publication exposure
  prior_hours: 2
  shadow_weight: 10  # positions per log(1 + clicks/(shown hours + prior))

# Hourly site check (scripts/site_check.js): photo floors that turn the run red,
# so the failure watch catches missing photos before a visitor does (operator
# 2026-10-15: "we need 99.99% of images showing up!"). Live 2026-10-15 21:11Z:
# 93% showing, 0 broken, 24 of the top 24 cards with a photo. Raise
# min_photo_pct as coverage improves.
site_check:
  min_photo_pct: 90         # live deals whose photo shows
  max_broken: 10            # deals whose photo fails to load
  first_screen_photos: 24   # of the top 24 cards on the home page

images:
  asin_backfill_per_run: 60   # existing Amazon links, once per deal
  short_links_per_run: 10     # additional amzn.to/a.co chains, HEAD only
  keepa_search_per_run: 10
  keepa_search_per_day: 120   # UTC; shares Keepa budget, after price rechecks
  keepa_match_min: 0.85       # strict photo-only title matches
