                 baby bottle, sippy cup, stroller]
          # Operator 2026-10-17: "items people always need" (her list of ~50).
          everyday: [paper towels, toilet paper, detergent, dish soap, trash bags,
                     toothpaste, toothbrush, deodorant, razor, vitamins,
                     laundry detergent, detergent pods, tide pods, gain flings, laundry pods,
                     laundry soap, stain remover, garbage bags, bath tissue, facial tissues,
                     tissues, kleenex, dishwasher pods, dishwasher tablets, dishwasher detergent,
                     floss, hand soap, hand wash, aluminum foil, tin foil, reynolds wrap,
                     ziploc bags, sandwich bags, freezer bags, food storage bags, plastic wrap,
                     cling wrap, parchment paper, body wash, shower gel, razors,
                     disinfecting wipes, all purpose cleaner, sponges, toilet bowl cleaner,
                     tampons, menstrual pads, maxi pads, panty liners, aa batteries,
                     aaa batteries, ground coffee, coffee beans, coffee pods, olive oil,
                     cooking oil, vegetable oil, avocado oil, spaghetti, pasta, penne, macaroni,
                     white rice, jasmine rice, basmati rice, canned tuna, canned soup,
