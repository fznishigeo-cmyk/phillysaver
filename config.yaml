search_circle: true
search_box_glow: true  # task 301: rainbow search border, shining Analyze and early Amazon button
same_product_spacing: true  # task 302: eight cards between families; at most two in the first 48
card_tidy: true  # operator 2026-10-18: folded checkout steps, clear cart chip, AI Analyze, price-drop Amazon button
page_polish: true  # task 304: event search and the brand-style Support page
header_polish: true  # task 305: aligned desktop search/actions and a single category row
all_discounts_button: true  # operator 2026-10-19: "All discounts" — "the same style as the Analyze button"
search_polish_1019: true  # operator 2026-10-19: "this is already at the bottom, remove it."; "Dropbox Blue"

site:
  credit_links: false         # plain source attribution; true/missing restores the previous site
  brand_pages: true           # task 289: operator approved the preview 2026-10-17 ("yes they look great")
  static_photos: true          # task 274: photos on static cards and deal pages
  open_box_scarcity: true   # task 273: never infer a stock count
  open_box_counts: false   # operator: publish only "often only 1" for now
  drop_rotation_windows: 3  # task 269: legacy 24-card rotation when drop_shuffle is off; 0 keeps server order
  drop_fresh: true  # task 303c: balanced ninety-card drops; missing/false preserves previous bytes
  drop_shuffle: true  # task 300: change Trending at every clock mark, even without a new publish; missing/false restores legacy drops
  dark_polish: true   # task 254: dark-mode-only CSS + color-scheme meta; light bytes unchanged
  strip_comments: true  # task 278: final home-only pass; missing/false preserves original bytes
  # Operator 2026-10-17: what Google shows for the homepage (like Slickdeals'
  # "Slickdeals: The Best Deals, Coupons, Promo Codes & Discounts"). Missing/empty
  # keeps the template's title/description bytes.
  home_title: "wowpriced: The Best Deals, Coupons, Promo Codes & Discounts"
  home_description: "Verified deals, coupons and promo codes from Amazon, Walmart, Target, Woot and more. We check every price before we show it."
  search_amazon: true         # tagged search fallback; queries stay local until clicked
  home_link_resets: true      # logo, Live deals and timer return to all deals; Back keeps the previous view
  trending_auto_cards: 1200   # operator 2026-10-17: Trending keeps loading while they scroll (was 300, then a Show more button)
  click_price_home_fill: true  # operator 2026-10-17 "it just stops": confirmed Add-to-Cart prices lead, other verified deals follow (was: hidden below 120 confirmed)
  offscreen_cards: true        # phones only; Chromium Back/reload restore exact at 390 and 1280 wide (2026-10-16)
  unconfirmed_label:
    enabled: true
    max_h_new: 48
    max_h_used: 48

# Operator 2026-10-16: Amazon Associates support (phone, reference amz378_998)
# approved price history charts, lowest recent price, Keepa as the source and
# keeping our own record privately. Follow-up call (same reference): the browser
# extension may show our history on Amazon pages; Amazon price-drop emails are NOT
# allowed, so Amazon watches stay off (best-deals newsletter instead).
# Operator 2026-10-17 ~04:05Z: Amazon emailed that price history may NOT be shown
# on the site ("we aren't allowed to do this"). Back to hide until Amazon says otherwise in writing.
