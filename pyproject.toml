[project]
name = "dealradar"
version = "0.1.0"
description = "Online-deal aggregator: polite multi-source fetch, LLM extraction with verbatim evidence, savings math, static site + Telegram + email digest."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]  # full suite in ~15 min: pytest -n 3

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealradar*"]

[tool.setuptools.package-data]
"dealradar.fetch" = ["public_suffix_list.dat.gz", "public_suffix_list.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-network integration tests and multi-hour capacity simulations (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
