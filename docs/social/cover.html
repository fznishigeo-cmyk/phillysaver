<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1640px;height:624px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:#fff;
 background:radial-gradient(900px 520px at 78% 18%,rgba(255,201,77,.18),transparent 60%),
            radial-gradient(800px 600px at 12% 110%,rgba(105,213,194,.28),transparent 60%),
            linear-gradient(120deg,#0b3f39 0%,#0c5f55 45%,#129486 100%);position:relative}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.6px,transparent 1.7px);background-size:34px 34px;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.tag{position:absolute;border:3px solid rgba(255,255,255,.14);border-radius:14px 34px 34px 14px;}
.tag:after{content:"";position:absolute;left:16px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:3px solid rgba(255,255,255,.18)}
.t1{width:210px;height:96px;left:70px;top:70px;transform:rotate(-14deg)}
.t2{width:170px;height:80px;right:90px;bottom:70px;transform:rotate(12deg)}
.t3{width:130px;height:62px;right:250px;top:46px;transform:rotate(-8deg);border-color:rgba(255,201,77,.35)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.brand{display:flex;align-items:center;gap:14px;font:800 34px/1 "Inter Display","Inter";letter-spacing:-.5px}
.brand img{width:52px;height:52px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
h1{font:900 84px/1.02 "Inter Display","Inter";letter-spacing:-2.5px;text-shadow:0 4px 24px rgba(0,0,0,.18)}
h1 span{color:#ffc94d}
p{font:500 34px/1.3 "Inter";color:#d9f4ec;max-width:1060px}
.chips{display:flex;gap:16px;margin-top:6px}
.chip{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);font:700 25px/1 "Inter"}
.chip b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ffc94d;color:#0b3f39;font-size:19px}
.url{position:absolute;right:56px;top:42px;padding:12px 24px;border-radius:999px;background:#ffc94d;color:#0b3f39;font:800 28px/1 "Inter"}
</style></head><body>
<div class="grid"></div><div class="tag t1"></div><div class="tag t2"></div><div class="tag t3"></div>
<div class="wrap">
 <div class="brand"><img src="logo.svg" alt="">wowpriced.com</div>
 <h1>Real deals. <span>Verified prices.</span></h1>
 <p>Every price is checked against its source before it goes live.</p>
 <div class="chips"><div class="chip"><b>✓</b>Free Deal Checker</div><div class="chip"><b>✓</b>Discount Finder</div><div class="chip"><b>✓</b>New deals all day</div></div>
</div>
</body></html>
