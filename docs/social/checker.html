<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:#fff;position:relative;padding:80px 76px;
 background:radial-gradient(700px 500px at 90% 0%,rgba(255,201,77,.22),transparent 60%),linear-gradient(140deg,#0b3f39,#0c5f55 55%,#129486)}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.6px,transparent 1.7px);background-size:34px 34px}
.rel{position:relative}
.brand{display:flex;align-items:center;gap:14px;font:800 34px/1 "Inter Display","Inter"}
.brand img{width:54px;height:54px}
.kicker{margin-top:70px;display:inline-block;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.14);font:700 26px/1 "Inter";color:#ffc94d}
h1{margin-top:22px;font:900 104px/1 "Inter Display","Inter";letter-spacing:-3px}
h1 span{color:#ffc94d}
.box{margin-top:54px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:12px 12px 12px 34px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.box .ph{flex:1;font:500 30px/1 "Inter";color:#7a8a86}
.box .btn{padding:24px 38px;border-radius:999px;background:#ffc94d;color:#0b3f39;font:800 30px/1 "Inter"}
ul{margin-top:48px;list-style:none;display:flex;flex-direction:column;gap:22px;padding:0}
li{display:flex;gap:18px;align-items:center;font:600 32px/1.25 "Inter";color:#e3f7f0}
li b{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#ffc94d;color:#0b3f39;font-size:26px}
.foot{position:absolute;left:76px;right:76px;bottom:70px;display:flex;justify-content:space-between;align-items:center;font:700 30px/1 "Inter";color:#d9f4ec}
.foot b{color:#fff}
</style></head><body>
<div class="rel">
 <div class="brand"><img src="logo.svg" alt="">wowpriced</div>
 <div class="kicker">Free Deal Checker</div>
 <h1>Is it really<br><span>a good deal?</span></h1>
 <div class="box"><div class="ph">Paste a product link…</div><div class="btn">Check it</div></div>
 <ul>
  <li><b>✓</b>Today's price vs. the list price</li>
  <li><b>✓</b>Compared with verified deals</li>
  <li><b>✓</b>Answer in seconds</li>
 </ul>
</div>
<div class="foot"><span>Free · No sign-up</span><b>wowpriced.com</b></div>
</body></html>
