# wowpriced Worker (see worker.js and README.md): the newsletter subscribe
# endpoints and the paywall API in one deployment.
# Deployed by .github/workflows/deploy-subscribe-worker.yml, which creates the
# KV namespace on first run and substitutes its id below (on a copy) before
# `wrangler deploy`. The secrets NEWSLETTER_SECRET, SESSION_SECRET and
# STRIPE_SECRET_KEY are set with `wrangler secret put`, never written here.
name = "wowpriced-subscribe"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
# Browser origins allowed to call the Worker cross-origin (comma list).
ALLOWED_ORIGINS = "https://wowpriced.com,https://www.wowpriced.com,https://fznishigeo-cmyk.github.io"
# Public paywall settings. The deploy workflow's inputs override these on the
# deployed copy for that run; the committed values are what a plain deploy
# ships (2026-10-11: a deploy without inputs blanked the Payment Link and
# checkout failed, so the live values live here now).
GOOGLE_CLIENT_ID = "242086574232-f057r0gmud5befbjk2cl6hofocr2mu45.apps.googleusercontent.com"  # OAuth Web client ID (public); Google sign-in is off when empty
STRIPE_PAYMENT_LINK = "https://buy.stripe.com/14A5kE5LjgC01PN3zZeIw01"  # the $9.99/mo Payment Link (live); me.subscribe_url is "" when empty, and
                            # POST /api/checkout bills its price unless STRIPE_PRICE_ID is set
STRIPE_PRICE_ID = ""        # the $9.99/mo recurring price (price_...); "" = the Payment Link's price
STRIPE_PORTAL_LINK = ""     # customer-portal link; me.portal_url is "" when empty
STRIPE_PORTAL_CONFIG = ""   # billing-portal configuration (bpc_...); "" = the active one scripts/stripe_setup.py
                            # made (metadata app=wowpriced), else the dashboard default
TRIAL_DAYS = "7"            # Stripe trial on a first checkout, card up front (0 = no trial)
SITE_URL = "https://wowpriced.com"  # Checkout success/cancel and portal return pages live here
# PBKDF2 rounds for new password hashes (auth.js scheme 2). 20,000 is ~3 ms of
# CPU, inside the Free plan's 10 ms per request; raise it on Workers Paid.
# Older hashes are re-made with the current count at the next login.
PBKDF2_ITERATIONS = "20000"

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACED_AT_DEPLOY"
