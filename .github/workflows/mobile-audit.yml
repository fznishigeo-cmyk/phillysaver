name: mobile audit (read-only)

# Daily check of how wowpriced.com feels on phones: headless Chromium in
# iPhone / Pixel / 360px / dark-mode profiles (scripts/mobile_audit.cjs).
# Our own site only. Writes the JSON to the run summary and screenshots as
# a short-lived artifact; changes nothing.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to audit"
        required: false
        default: "https://wowpriced.com"
  schedule:
    - cron: '7 10 * * *'   # 6:07am New York (EDT)

permissions:
  contents: read

concurrency:
  group: mobile-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit
        env:
          URL: ${{ inputs.url || 'https://wowpriced.com' }}
        run: |
          mkdir -p shots
          node scripts/mobile_audit.cjs "$URL" shots/mobile > audit.json
          { echo '## Mobile audit'; echo; echo '```json'; cat audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat audit.json
      # The operator's 8:30am recap shows the live homepage on a phone (light
      # and dark); artifacts are not reachable from the recap's machine, so
      # copy those two shots to the private reports repo.
      - name: Copy phone screenshots to the private reports repo
        if: always()
        env:
          REPORTS_REPO_TOKEN: ${{ secrets.REPORTS_REPO_TOKEN }}
        run: |
          if [ -z "$REPORTS_REPO_TOKEN" ] || ! ls shots/mobile-iphone14*.png >/dev/null 2>&1; then echo "screenshots not copied"; exit 0; fi
          day=$(TZ=America/New_York date +%F)
          git clone -q --depth 1 "https://x-access-token:${REPORTS_REPO_TOKEN}@github.com/fznishigeo-cmyk/wowpriced-reports.git" reports
          mkdir -p "reports/ops/shots/$day"
          cp shots/mobile-iphone14.png shots/mobile-iphone14-dark.png "reports/ops/shots/$day/"
          cd reports
          git add ops/shots
          git -c user.name="wowpriced bot" -c user.email="hello@wowpriced.com" commit -qm "Phone screenshots $day" || exit 0
          git push -q || echo "push failed"
      - uses: actions/upload-artifact@v6
        with:
          name: mobile-audit
          path: |
            audit.json
            shots/
          retention-days: 7
