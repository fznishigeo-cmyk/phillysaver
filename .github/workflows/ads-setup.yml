# One-time: create the ads.setup Search campaign PAUSED. No state, no email.
# The operator enables it in Google Ads; the hourly guard keeps watching it.
# update_ads: only swap each ad group's ad headlines/descriptions for the config copy.
# add_keywords: only add config keywords missing from each ad group (phrase, no bid).
name: ads setup

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Only ask Google to check the campaign (create nothing)"
        type: boolean
        default: true
      update_ads:
        description: "Replace each ad group's ad headlines/descriptions with config.yaml (nothing else)"
        type: boolean
        default: false
      add_keywords:
        description: "Add config.yaml keywords missing from each ad group, phrase match, no bid (nothing else)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        run: pip install -e .

      - name: Create the campaign (paused), update its ad text or add keywords
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          UPDATE_ADS: ${{ inputs.update_ads }}
          ADD_KEYWORDS: ${{ inputs.add_keywords }}
        run: |
          flags=""
          if [ "$VALIDATE_ONLY" != "false" ]; then flags="--validate-only"; fi
          if [ "$UPDATE_ADS" = "true" ]; then flags="$flags --update-ads"; fi
          if [ "$ADD_KEYWORDS" = "true" ]; then flags="$flags --add-keywords"; fi
          python -m dealradar ads-setup $flags
