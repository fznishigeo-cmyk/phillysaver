# Daily maintenance: the data branch gains ~150 commits a day (every run plus
# the pre-send checkpoints), each a fresh ~13 MB encrypted snapshot that git
# cannot delta-compress. Monthly let the repository reach 7.2 GB (2026-10-13).
# This squashes it to a single orphan commit holding the current tree so the
# repository stays small. Touches ONLY the data branch — never main.
name: squash data branch

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC daily (11:17pm New York)
  workflow_dispatch:

permissions:
  contents: write

# Its own queue. In the shared `dealradar` group a waiting squash was replaced
# by the next 10-minute run before it started (2026-10-20 03:43Z, cancelled
# with 0 jobs). Racing a state commit is safe: the squash only pushes over the
# exact tip it squashed (force-with-lease, retried if a run pushed meanwhile),
# and commit_state.sh re-snapshots onto whatever tip it finds.
concurrency:
  group: dealradar-squash
  cancel-in-progress: false

jobs:
  squash:
    name: squash data branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1 # only the data tip is needed; its history is gigabytes

      - name: Squash data branch to a single commit
        run: |
          set -euo pipefail
          git config user.name 'dealradar-bot'
          git config user.email 'actions@users.noreply.github.com'
          squash() {
            git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data || true
            if ! git rev-parse --verify --quiet origin/data >/dev/null; then
              echo 'no data branch yet - nothing to squash'
              exit 0
            fi
            # Detach at the data tip, then re-root the exact same tree as a
            # single orphan commit and force-push it back to data.
            FETCHED_SHA="$(git rev-parse origin/data)" || return 1
            git checkout --quiet --detach origin/data || return 1
            git branch -D data-squashed >/dev/null 2>&1 || true
            git checkout --orphan data-squashed || return 1
            git add -A || return 1
            git commit --quiet -m 'squash data branch (daily)' || return 1
            # force-with-lease pinned to the tip we squashed: if any run pushed
            # state between our fetch and this push, retry from the new tip
            # instead of discarding that state commit.
            git push --force-with-lease=refs/heads/data:"$FETCHED_SHA" origin HEAD:data
          }
          for delay in 2 4 8 16 0; do
            if squash; then
              echo 'data branch squashed'
              exit 0
            fi
            if [ "$delay" -eq 0 ]; then
              break
            fi
            echo "data branch moved during the squash - retrying in ${delay}s"
            sleep "$delay"
          done
          echo '::error::data branch squash failed after 5 attempts'
          exit 1
