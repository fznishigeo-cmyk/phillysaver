# Deploys the wowpriced Worker (cloudflare/subscribe-worker): the free daily
# email list's subscribe endpoints and the paywall API (accounts, sessions,
# membership, the members-only deals), one Worker on the Cloudflare account
# behind CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Idempotent: creates the
# KV namespace once, redeploys the code, re-puts NEWSLETTER_SECRET (required),
# SESSION_SECRET and STRIPE_SECRET_KEY (each skipped with a notice when the
# repository secret is empty) on the Worker, and prints the Worker URL in the
# job summary (paste it into config.yaml newsletter.worker_url and
# paywall.api_url). The public vars GOOGLE_CLIENT_ID, STRIPE_PAYMENT_LINK,
# STRIPE_PRICE_ID, STRIPE_PORTAL_LINK and TRIAL_DAYS come from the dispatch
# inputs, substituted into the deployed copy of wrangler.toml: re-run with new
# inputs to change them (an empty input keeps wrangler.toml's value; SITE_URL
# is set in wrangler.toml only). It also reports whether the Stripe key and the
# Payment Link are live or test mode, and warns when they differ. Secret values
# are never printed.
name: deploy subscribe worker

on:
  workflow_dispatch:
    inputs:
      google_client_id:
        description: "GOOGLE_CLIENT_ID: public OAuth Web client ID for Google sign-in (empty keeps wrangler.toml's value)"
        required: false
        default: ""
      stripe_payment_link:
        description: "STRIPE_PAYMENT_LINK: the $9.99/mo Payment Link, e.g. https://buy.stripe.com/... (empty keeps wrangler.toml's value)"
        required: false
        default: ""
      stripe_price_id:
        description: "STRIPE_PRICE_ID: the $9.99/mo recurring price (price_...) the Worker's checkout bills (empty keeps wrangler.toml's value; empty there = the Payment Link's price)"
        required: false
        default: ""
      stripe_portal_link:
        description: "STRIPE_PORTAL_LINK: customer-portal link, e.g. https://billing.stripe.com/p/login/... (empty keeps wrangler.toml's value)"
        required: false
        default: ""
      trial_days:
        description: "TRIAL_DAYS: Stripe trial on a first checkout, card up front, in days; 0 = no trial (empty keeps wrangler.toml's value)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: deploy subscribe worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/subscribe-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Find or create the KV namespace
        id: kv
        run: |
          set -euo pipefail
          find_id() {
            # wrangler may prefix the title with the Worker name; accept both,
            # and skip any banner it prints before the JSON array.
            wrangler kv namespace list | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const want = ["wowpriced_subs", "wowpriced-subscribe-wowpriced_subs"];
                const arr = JSON.parse(s.slice(s.indexOf("["), s.lastIndexOf("]") + 1));
                const ns = arr.find((n) => want.includes(n.title));
                process.stdout.write(ns ? ns.id : "");
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            wrangler kv namespace create wowpriced_subs
            id="$(find_id)"
          fi
          [ -n "$id" ] || { echo "::error::KV namespace wowpriced_subs not found after creating it"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker
        id: deploy
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
          GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
          STRIPE_PAYMENT_LINK: ${{ inputs.stripe_payment_link }}
          STRIPE_PRICE_ID: ${{ inputs.stripe_price_id }}
          STRIPE_PORTAL_LINK: ${{ inputs.stripe_portal_link }}
          TRIAL_DAYS: ${{ inputs.trial_days }}
        run: |
          set -euo pipefail
          sed "s/REPLACED_AT_DEPLOY/$KV_ID/" wrangler.toml > wrangler.deploy.toml
          # Non-empty inputs replace the matching [vars] lines on the copy
          # (JSON string escaping is valid TOML basic-string escaping).
          node -e '
            const fs = require("fs");
            let toml = fs.readFileSync("wrangler.deploy.toml", "utf8");
            for (const name of ["GOOGLE_CLIENT_ID", "STRIPE_PAYMENT_LINK", "STRIPE_PRICE_ID", "STRIPE_PORTAL_LINK", "TRIAL_DAYS"]) {
              const value = (process.env[name] || "").trim();
              if (!value) continue;
              if (name === "TRIAL_DAYS" && !/^\d+$/.test(value)) throw new Error("trial_days must be a whole number");
              const re = new RegExp("^" + name + " = .*$", "m");
              if (!re.test(toml)) throw new Error(name + " is missing from wrangler.toml [vars]");
              // A function replacer: "$&", "$1" and friends inside a value go in
              // verbatim instead of being read as replacement patterns.
              toml = toml.replace(re, () => name + " = " + JSON.stringify(value));
              console.log("set " + name + " from the workflow input");
            }
            fs.writeFileSync("wrangler.deploy.toml", toml);'
          wrangler deploy --config wrangler.deploy.toml | tee deploy.log
          url="$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' deploy.log | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Put the list secret on the Worker
        env:
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$NEWSLETTER_SECRET" ] || { echo "::error::NEWSLETTER_SECRET repository secret is not set"; exit 1; }
          printf '%s' "$NEWSLETTER_SECRET" | wrangler secret put NEWSLETTER_SECRET --config wrangler.deploy.toml

      - name: Put the session secret on the Worker
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SESSION_SECRET" ]; then
            echo "::notice::SESSION_SECRET repository secret is not set; skipped (sign-in stays off until it is set and this workflow is re-run)"
            exit 0
          fi
          printf '%s' "$SESSION_SECRET" | wrangler secret put SESSION_SECRET --config wrangler.deploy.toml

      - name: Put the Stripe key on the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::notice::STRIPE_SECRET_KEY repository secret is not set; skipped (nobody is a member and checkout is off until it is set and this workflow is re-run)"
            exit 0
          fi
          printf '%s' "$STRIPE_SECRET_KEY" | wrangler secret put STRIPE_SECRET_KEY --config wrangler.deploy.toml

      # Live vs test mode, from the key's prefix and the link's path only (a
      # test Payment Link is https://buy.stripe.com/test_...): the key itself is
      # never printed. A test key cannot see live checkouts, and the reverse.
      - name: Report the Stripe key mode
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          key_mode=""
          case "$STRIPE_SECRET_KEY" in
            "") echo "::notice::Stripe key mode: not set" ;;
            sk_live_*|rk_live_*) key_mode=live; echo "::notice::Stripe key mode: live" ;;
            sk_test_*|rk_test_*) key_mode=test; echo "::warning::Stripe key is a TEST key: live checkouts cannot be verified" ;;
            *) echo "::warning::Stripe key mode: unrecognized (expected an sk_live_/rk_live_ or sk_test_/rk_test_ key)" ;;
          esac
          # The Payment Link as deployed: the input, else wrangler.toml's value.
          link="$(sed -n 's/^STRIPE_PAYMENT_LINK = "\([^"]*\)".*/\1/p' wrangler.deploy.toml)"
          link_mode=""
          case "$link" in
            "") echo "::notice::Payment Link mode: not set" ;;
            */test_*) link_mode=test; echo "::warning::Payment Link is a TEST link: real cards cannot pay it" ;;
            https://*) link_mode=live; echo "::notice::Payment Link mode: live" ;;
            *) echo "::warning::Payment Link mode: unrecognized (expected https://buy.stripe.com/...)" ;;
          esac
          if [ -n "$key_mode" ] && [ -n "$link_mode" ] && [ "$key_mode" != "$link_mode" ]; then
            echo "::warning::Stripe key mode ($key_mode) and Payment Link mode ($link_mode) differ: checkouts and claims fail until both are the same mode (live for real customers)"
          fi

      - name: Write the job summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## subscribe worker deployed"
            if [ -n "$WORKER_URL" ]; then
              echo "Worker URL: **$WORKER_URL**"
            else
              echo "Worker URL: see the 'Deploy the Worker' step log (wrangler prints the workers.dev URL) or Cloudflare dashboard -> Workers & Pages -> wowpriced-subscribe"
            fi
            echo
            echo "Paste it into config.yaml under newsletter.worker_url and paywall.api_url (the same URL in both places):"
            echo
            echo '    newsletter:'
            echo '      worker_url: "<the URL above>"'
            echo '    paywall:'
            echo '      api_url: "<the URL above>"'
            echo
            echo "Re-run this workflow with the inputs filled in to change GOOGLE_CLIENT_ID, STRIPE_PAYMENT_LINK, STRIPE_PRICE_ID, STRIPE_PORTAL_LINK or TRIAL_DAYS on the Worker."
          } >> "$GITHUB_STEP_SUMMARY"
