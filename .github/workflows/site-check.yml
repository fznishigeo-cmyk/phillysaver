name: site check (read-only)

# Every hour: opens wowpriced.com in Chromium, loads every live deal's photo
# the way a visitor's browser does, and writes which deals have no photo or
# a broken one (by store, source and host) to the run summary, then checks
# visitor controls and public pages on desktop and phone. Failed walk-through
# steps and photos below the config.yaml site_check floors turn the run red. Read-only;
# analytics and ad tags are blocked. It never touches state.db or the data
# branch, and it prints only what the public site already shows.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: site-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        # The system-library step (apt) took 8.5-9.5 min twice on 2026-10-22 and timed the
        # 12-minute watch out (#199, #201). Cap it; the runner image already has
        # Chromium's libraries, so the browser alone is enough when apt is slow.
        run: npm install --no-save playwright@1.48.2 && (timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium)
      - name: Check the live site
        run: node scripts/site_check.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-shots
          path: shots/
          retention-days: 3
