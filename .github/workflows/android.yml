name: Android build (manual artifacts only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Increasing positive Play version code
        required: true
        default: '1'
        type: string
      version_name:
        description: Display version
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: android-signing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.27.0
      - name: Configure installed tools
        run: |
          mkdir -p "$HOME/.bubblewrap"
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > "$HOME/.bubblewrap/config.json"
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s cmdline-tools/latest "$ANDROID_HOME/tools"
          fi
      - name: Prepare temporary project and version
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Invalid version code"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "Invalid version name"
            exit 1
          fi
          cp -R android "$RUNNER_TEMP/twa"
          cd "$RUNNER_TEMP/twa"
          jq --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            '.appVersionCode = $code | .appVersionName = $name' twa-manifest.json > version.json
          mv version.json twa-manifest.json
      - name: Generate and build
        env:
          CI: 'true'
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LC_ALL: C
        run: |
          cd "$RUNNER_TEMP/twa"
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > upload.keystore
            bubblewrap update --skipVersionUpgrade < /dev/null
            bubblewrap build < /dev/null
            keytool -list -v -keystore upload.keystore -alias upload \
              -storepass:env BUBBLEWRAP_KEYSTORE_PASSWORD | awk '/SHA256:/ {print}'
          else
            bubblewrap update --skipVersionUpgrade < /dev/null
            bubblewrap build --skipSigning < /dev/null
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: |
            ${{ runner.temp }}/twa/*.aab
            ${{ runner.temp }}/twa/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/twa/upload.keystore"
