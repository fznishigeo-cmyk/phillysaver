# Weekly coverage diagnostics; local snapshot only, never commits state.
name: source coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

concurrency:
  group: source-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Every enabled registry entry gets its own 90-second adapter budget.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar and Telegram adapter
        run: pip install -e '.[telegram]'

      - name: Restore read-only state snapshot
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
        run: bash scripts/restore_state.sh

      - name: Audit enabled sources
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          MEH_API_KEY: ${{ secrets.MEH_API_KEY }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY2 || secrets.SOVRN_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NEWSLETTER_INBOX_TOKEN: ${{ secrets.NEWSLETTER_INBOX_TOKEN }}
        run: python -m dealradar source-audit
