# Fast lane: every 10 minutes (real cadence is bounded by run duration and
# cron drift), fetching only the fast_lane sources. The Keepa adapter
# throttles ITSELF to ~15-minute pulls so the lane never outruns the Keepa
# token allowance.
# The run job holds the `dealradar` concurrency group shared with hourly.yml
# (cancel-in-progress false), so the two never overlap — they queue instead.
# Fast runs first wait in their own `dealradar-fast` group: GitHub keeps one
# pending run per group and a newer one replaces it, so a fast run queued in
# the shared group would replace a waiting hourly run (its intake, Ads guard
# and social posts), as one replaced squash run 9 on 2026-10-20. This way at
# most one fast run waits on the shared lock, and only while no fast run holds it.
# Deploys the site like hourly.yml does: a fast-lane find (Keepa price drops)
# must reach the page within minutes, not wait for the top of the hour.
name: dealradar fast lane

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: dealradar-fast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: fast-lane run
    runs-on: ubuntu-latest
    concurrency:
      group: dealradar
      cancel-in-progress: false
    env:
      DEALRADAR_DURABLE_STATE: "1"
      DEALRADAR_RUN_KEY: "${{ github.workflow }}:${{ github.run_id }}"
    # Runs take 8.5-10 min (2026-10-18, with the state size report); 12 left no
    # room for a slow checkout.
    timeout-minutes: 20  # fast #788 needed 14m21s (daily source revalidation + render); 15 left 39 s
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1 # state scripts explicitly fetch origin/data

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        run: pip install -e .

      - name: Restore state from data branch
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          # Read only when the data branch holds an R2 pointer (state.r2_primary).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/restore_state.sh

      - name: Run pipeline (fast lane)
        id: pipeline
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          # Pre-send state checkpoints run commit_state.sh (state.r2_primary).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DEALS_CLAUDE_API_KEY: ${{ secrets.DEALS_CLAUDE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          MEH_API_KEY: ${{ secrets.MEH_API_KEY }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY2 || secrets.SOVRN_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          NEWSLETTER_INBOX_TOKEN: ${{ secrets.NEWSLETTER_INBOX_TOKEN }}
          CLICK_SIGNAL_TOKEN: ${{ secrets.CLICK_SIGNAL_TOKEN }}
        run: python -m dealradar run --fast-lane

      - name: Commit state to data branch
        # Save billed calls and pending deliveries even when the pipeline fails.
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/commit_state.sh

      - name: Deploy site to Cloudflare Pages
        id: deploy
        working-directory: . # wrangler bundles ./functions alongside site/
        # The site's only host (wowpriced.com and www point at this project;
        # GitHub Pages was retired 2026-10-11: its terms bar commercial
        # sites). A failed deploy turns the run red; state is already
        # committed, and the next run deploys again.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # A pasted secret can carry a stray space, line break or "Bearer "
          # (live 2026-10-14: "Invalid format for Authorization header").
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*[Bb]earer[[:space:]]+//' | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Pages deploy skipped (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID unset): wowpriced.com is not updated"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          # Shape only, never the value: tells a bad paste from a bad permission.
          kind=other; case "$CLOUDFLARE_API_TOKEN" in cfat_*) kind=account;; cfut_*) kind=user;; esac
          chars=unexpected; [[ "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] && chars=ok
          echo "Cloudflare token: ${#CLOUDFLARE_API_TOKEN} characters, ${kind} token, characters ${chars}"
          npx --yes wrangler@4 pages project create wowpriced --production-branch main >/dev/null 2>&1 || true
          test -f ./functions/api/search.js
          deploy() { npx --yes wrangler@4 pages deploy site --project-name wowpriced --branch main --commit-dirty=true 2>&1 | tee cf-pages.log; }
          # Cloudflare sometimes answers "Unknown internal error" (3 runs on
          # 2026-10-12); uploads go by content hash, so one retry is cheap.
          if ! deploy; then
            echo "::warning::Cloudflare Pages deploy failed once; retrying in 30 s"
            sleep 30
            deploy
          fi
          url="$(grep -o 'https://[A-Za-z0-9.-]*\.pages\.dev' cf-pages.log | tail -1 || true)"
          echo "Cloudflare Pages: ${url:-see log}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tell search engines what changed (IndexNow)
        id: indexnow
        # Receipt only after this run's pages and key file were deployed.
        if: ${{ success() && steps.pipeline.outcome == 'success' && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          # Pre-send state checkpoints run commit_state.sh (state.r2_primary).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m dealradar indexnow --deployed --run-key "$DEALRADAR_RUN_KEY"

      - name: Commit IndexNow receipts to data branch
        # Save receipts, key validation pending, and retries even after failure.
        if: ${{ !cancelled() && steps.indexnow.outcome != 'skipped' }}
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/commit_state.sh
