# Manual read-only Keyword Planner access test; all results stay private.
name: keyword volumes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyword-volumes
  cancel-in-progress: false

jobs:
  volumes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        run: pip install -e .

      - name: Read keyword volumes into the private reports repo
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          REPORTS_REPO_TOKEN: ${{ secrets.REPORTS_REPO_TOKEN }}
        run: python -m dealradar keyword-volumes
