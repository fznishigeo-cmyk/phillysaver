name: install search secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Pages search secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
        run: |
          set -euo pipefail
          [ -n "${KEEPA_KEY:-}" ] || exit 0
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || exit 1
          printf '%s' "$KEEPA_KEY" | npx --yes wrangler@4 pages secret put KEEPA_KEY --project-name wowpriced >/dev/null 2>&1
