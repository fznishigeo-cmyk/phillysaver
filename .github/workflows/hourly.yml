# Hourly pipeline: fetch -> parse -> savings -> dedupe/verify/rank -> publish.
# State (state.db) lives on the `data` branch; the site deploys to GitHub Pages
# via the official Pages artifact actions (no gh-pages branch commits).
# Secrets are passed as environment variables only and are never echoed.
name: dealradar hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Shared with fast.yml so the hourly run and the fast lane never overlap.
concurrency:
  group: dealradar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    name: hourly run
    runs-on: ubuntu-latest
    timeout-minutes: 15  # hard stop; the run itself targets < 3 min of runner time
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        run: pip install -e .

      - name: Restore state from data branch
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
        run: bash scripts/restore_state.sh

      - name: Run pipeline
        env:
          DEALS_CLAUDE_API_KEY: ${{ secrets.DEALS_CLAUDE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          MEH_API_KEY: ${{ secrets.MEH_API_KEY }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: python -m dealradar run

      - name: Commit state to data branch
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
        run: bash scripts/commit_state.sh

      - name: Deploy site to Cloudflare Pages
        # Second host for the same site/ directory: commercial use is allowed
        # there, bandwidth is unmetered and the custom domain gets its own
        # certificate. Soft-fails so a Cloudflare hiccup never fails a run;
        # skipped until the Cloudflare secrets exist.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare Pages deploy skipped (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID unset)"
            exit 0
          fi
          npx --yes wrangler@4 pages project create wowpriced --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site --project-name wowpriced --branch main --commit-dirty=true | tee cf-pages.log
          url="$(grep -o 'https://[A-Za-z0-9.-]*\.pages\.dev' cf-pages.log | tail -1 || true)"
          echo "Cloudflare Pages: ${url:-see log}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        id: cfgpages
        # Soft-fail: creating the Pages site needs admin rights the workflow
        # token may not have ("Resource not accessible by integration"). Until
        # Pages is enabled once at Settings -> Pages -> Source: GitHub Actions,
        # the deploy steps below are skipped and the run stays green — the
        # pipeline and state commit still did their job. Once Pages exists,
        # these steps run and a REAL deploy failure fails the run normally.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        if: steps.cfgpages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.cfgpages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Note skipped deploy
        if: steps.cfgpages.outcome != 'success'
        run: |
          echo "::warning::Site deploy skipped - enable GitHub Pages once at Settings -> Pages -> Source = GitHub Actions"

      - name: Tell search engines what changed (IndexNow)
        # After the deploys, so the pages and the key file are live. Posts
        # the URLs this run's publish found changed (Bing, Yahoo, DuckDuckGo
        # and Yandex share IndexNow); logs counts and the HTTP status only,
        # and a failure never fails the run.
        continue-on-error: true
        run: python -m dealradar indexnow
