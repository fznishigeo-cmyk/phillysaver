# Hourly pipeline: fetch -> parse -> savings -> dedupe/verify/rank -> publish.
# State (state.db) lives on the `data` branch; the site deploys to Cloudflare
# Pages (project wowpriced), which serves wowpriced.com since 2026-10-11.
# Secrets are passed as environment variables only and are never echoed.
name: dealradar hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Shared with fast.yml so the hourly run and the fast lane never overlap.
concurrency:
  group: dealradar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: hourly run
    runs-on: ubuntu-latest
    env:
      DEALRADAR_DURABLE_STATE: "1"
      DEALRADAR_RUN_KEY: "${{ github.workflow }}:${{ github.run_id }}"
    # Hard stop. The pipeline has its own 10 min budget (config.yaml run_budget_s); the
    # rest is checkout, deploy and posting. 15 was too tight: run 164 (2026-10-15) did
    # all its work in 15:02, including a 2.4 min checkout, and was marked cancelled.
    # 20 was too tight too: run 222 (2026-10-18) hit it right after committing
    # state, so the Pinterest and Facebook steps never ran that hour.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Like the fast lane: the state scripts fetch origin/data themselves.
          # Full history (every unsquashed state snapshot) took 6-20 min on
          # 2026-10-20 and run 283 hit the 30 min limit before committing state.
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        id: install
        run: pip install -e ".[telegram]"

      - name: Restore state from data branch
        id: restore
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
        run: bash scripts/restore_state.sh

      - name: Guard Google Ads spending
        id: ads_guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true  # finish the pipeline; surface guard failure at the end
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          STATE_RESTORED: ${{ steps.restore.outcome == 'success' }}
        run: |
          if [ "$STATE_RESTORED" = "true" ]; then
            python -m dealradar ads-guard
          else
            python -m dealradar ads-guard --state-unavailable
          fi

      - name: Run pipeline
        id: pipeline
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          DEALS_CLAUDE_API_KEY: ${{ secrets.DEALS_CLAUDE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          MEH_API_KEY: ${{ secrets.MEH_API_KEY }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY2 || secrets.SOVRN_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          NEWSLETTER_INBOX_TOKEN: ${{ secrets.NEWSLETTER_INBOX_TOKEN }}
          CLICK_SIGNAL_TOKEN: ${{ secrets.CLICK_SIGNAL_TOKEN }}
        run: python -m dealradar run

      - name: Commit state to data branch
        # Save billed calls and pending deliveries even when the pipeline fails.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (steps.pipeline.outcome != 'skipped' || steps.ads_guard.outcome != 'skipped') }}
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/commit_state.sh

      - name: Deploy site to Cloudflare Pages
        id: deploy
        working-directory: . # wrangler bundles ./functions alongside site/
        # The site's only host (wowpriced.com and www point at this project;
        # GitHub Pages was retired 2026-10-11: its terms bar commercial
        # sites). A failed deploy turns the run red; state is already
        # committed, and the next run deploys again.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # A pasted secret can carry a stray space, line break or "Bearer "
          # (live 2026-10-14: "Invalid format for Authorization header").
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*[Bb]earer[[:space:]]+//' | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Pages deploy skipped (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID unset): wowpriced.com is not updated"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          # Shape only, never the value: tells a bad paste from a bad permission.
          kind=other; case "$CLOUDFLARE_API_TOKEN" in cfat_*) kind=account;; cfut_*) kind=user;; esac
          chars=unexpected; [[ "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] && chars=ok
          echo "Cloudflare token: ${#CLOUDFLARE_API_TOKEN} characters, ${kind} token, characters ${chars}"
          npx --yes wrangler@4 pages project create wowpriced --production-branch main >/dev/null 2>&1 || true
          test -f ./functions/api/search.js
          deploy() { npx --yes wrangler@4 pages deploy site --project-name wowpriced --branch main --commit-dirty=true 2>&1 | tee cf-pages.log; }
          # Cloudflare sometimes answers "Unknown internal error" (3 runs on
          # 2026-10-12); uploads go by content hash, so one retry is cheap.
          if ! deploy; then
            echo "::warning::Cloudflare Pages deploy failed once; retrying in 30 s"
            sleep 30
            deploy
          fi
          url="$(grep -o 'https://[A-Za-z0-9.-]*\.pages\.dev' cf-pages.log | tail -1 || true)"
          echo "Cloudflare Pages: ${url:-see log}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tell search engines what changed (IndexNow)
        id: indexnow
        # Receipt only after this run's pages and key file were deployed.
        if: ${{ success() && steps.pipeline.outcome == 'success' && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
        run: python -m dealradar indexnow --deployed --run-key "$DEALRADAR_RUN_KEY"

      - name: Commit IndexNow receipts to data branch
        # Save receipts, key validation pending, and retries even after failure.
        if: ${{ !cancelled() && steps.indexnow.outcome != 'skipped' }}
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/commit_state.sh

      - name: Post top deals to Pinterest
        id: pinterest
        continue-on-error: true
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: python -m dealradar pinterest-post

      - name: Post top deals to Facebook and Instagram
        id: meta
        continue-on-error: true
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
        run: python -m dealradar meta-post

      - name: Commit social state to data branch
        # Persist partial successes and refreshed tokens even if posting fails.
        if: ${{ !cancelled() && (steps.pinterest.outcome != 'skipped' || steps.meta.outcome != 'skipped') }}
        env:
          STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/commit_state.sh

      - name: Surface Ads guard failure
        if: ${{ !cancelled() && steps.ads_guard.outcome == 'failure' }}
        run: exit 1
