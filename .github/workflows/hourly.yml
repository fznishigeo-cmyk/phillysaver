# Hourly pipeline: fetch -> parse -> savings -> dedupe/verify/rank -> publish.
# State (state.db) lives on the `data` branch; the site deploys to GitHub Pages
# via the official Pages artifact actions (no gh-pages branch commits).
# Secrets are passed as environment variables only and are never echoed.
name: dealradar hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Shared with fast.yml so the hourly run and the fast lane never overlap.
concurrency:
  group: dealradar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    name: hourly run
    runs-on: ubuntu-latest
    timeout-minutes: 15  # hard stop; the run itself targets < 3 min of runner time
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dealradar
        run: pip install -e .

      - name: Restore state from data branch
        run: |
          git fetch origin data || true
          git checkout origin/data -- state.db 2>/dev/null || echo 'no prior state'

      - name: Run pipeline
        env:
          DEALS_CLAUDE_API_KEY: ${{ secrets.DEALS_CLAUDE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          MEH_API_KEY: ${{ secrets.MEH_API_KEY }}
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python -m dealradar run

      - name: Commit state to data branch
        run: bash scripts/commit_state.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first use so no manual settings click is
          # needed. If the token is not allowed to create it, enable once at
          # Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
